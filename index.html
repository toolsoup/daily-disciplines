// ─── Storage Helpers ──────────────────────────────────────────
function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch { return fallback; }
}

function saveJSON(key, data) {
  localStorage.setItem(key, JSON.stringify(data));
}

function monthKey(year, month) {
  return `${year}-${String(month + 1).padStart(2, '0')}`;
}

function migrateConfig(config) {
  if (!config || !config.categories) return config;
  config.categories.forEach(c => {
    c.habits.forEach(h => {
      if (h.type === 'boolean') {
        // Migrate old boolean type: if goal was set and less than 28, treat as per_month
        if (h.goal && h.goal < 28) {
          h.type = 'per_month';
          h.perMonth = h.goal;
        } else {
          h.type = 'daily';
        }
        delete h.goal;
      }
    });
  });
  return config;
}

function loadConfig() {
  const raw = loadJSON('dd-config', null);
  return raw ? migrateConfig(raw) : JSON.parse(JSON.stringify(DEFAULT_CONFIG));
}

// Count how many times selected weekdays occur in a given month
function countActiveDaysInMonth(activeDays, year, month) {
  if (!activeDays || activeDays.length === 0) return 0;
  const dim = new Date(year, month + 1, 0).getDate();
  let count = 0;
  for (let d = 1; d <= dim; d++) {
    if (activeDays.includes(new Date(year, month, d).getDay())) count++;
  }
  return count;
}

// Count calendar weeks that overlap with a month (any partial week counts)
function getWeeksInMonthCount(year, month) {
  const dim = new Date(year, month + 1, 0).getDate();
  let weeks = 0;
  let d = 1;
  while (d <= dim) {
    weeks++;
    const dow = new Date(year, month, d).getDay();
    // Jump to next Monday (start of next week)
    const daysUntilMon = dow === 0 ? 1 : (8 - dow);
    d += daysUntilMon;
  }
  return weeks;
}

// Compute the effective goal for a habit given the month context
function habitGoalForMonth(habit, year, month) {
  const dim = new Date(year, month + 1, 0).getDate();
  switch (habit.type) {
    case 'daily': return dim;
    case 'specific_days': return countActiveDaysInMonth(habit.activeDays || [], year, month);
    case 'per_week': return (habit.perWeek || 1) * getWeeksInMonthCount(year, month);
    case 'per_month': return habit.perMonth || 1;
    default: return dim;
  }
}

// Check if a day is an "active" day for a habit
function isDayActiveForHabit(habit, year, month, day) {
  if (habit.type === 'specific_days') {
    const dow = new Date(year, month, day).getDay();
    return (habit.activeDays || []).includes(dow);
  }
  return true;
}

// Migrate all localStorage dd-* data to Firestore on first sign-in
async function migrateLocalToCloud(uid) {
  // Upload config
  const config = loadConfig();
  await firestoreConfigRef(uid).set({ categories: config.categories }, { merge: true });

  // Find all dd-checks-*, dd-metrics-*, dd-notes-* keys
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (!key) continue;
    const checksMatch = key.match(/^dd-checks-(\d{4})-(\d{2})$/);
    const metricsMatch = key.match(/^dd-metrics-(\d{4})-(\d{2})$/);
    const notesMatch = key.match(/^dd-notes-(\d{4})-(\d{2})$/);
    const journalMatch = key.match(/^dd-journal-(\d{4})-(\d{2})$/);
    const goalsMatch = key.match(/^dd-goals-(\d{4})-(\d{2})$/);

    if (checksMatch || metricsMatch || notesMatch || journalMatch || goalsMatch) {
      const match = checksMatch || metricsMatch || notesMatch || journalMatch || goalsMatch;
      const mk = `${match[1]}-${match[2]}`;
      const ref = db.collection('users').doc(uid).collection('months').doc(mk);
      const data = {};
      const checksKey = `dd-checks-${mk}`;
      const metricsKey = `dd-metrics-${mk}`;
      const notesKey = `dd-notes-${mk}`;
      const journalKey = `dd-journal-${mk}`;
      const goalsKey = `dd-goals-${mk}`;
      if (localStorage.getItem(checksKey)) data.checks = JSON.parse(localStorage.getItem(checksKey));
      if (localStorage.getItem(metricsKey)) data.metrics = JSON.parse(localStorage.getItem(metricsKey));
      if (localStorage.getItem(notesKey)) data.notes = JSON.parse(localStorage.getItem(notesKey));
      if (localStorage.getItem(journalKey)) data.journal = JSON.parse(localStorage.getItem(journalKey));
      if (localStorage.getItem(goalsKey)) data.goals = JSON.parse(localStorage.getItem(goalsKey));
      if (Object.keys(data).length > 0) {
        await ref.set(data, { merge: true });
      }
    }
  }
}

const DAY_ABBR = ['S','M','T','W','T','F','S'];

const WEEK_COLORS = ['#3B82F6', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6', '#EC4899'];

function getWeekNumber(year, month, day) {
  const d = new Date(year, month, day);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
  const week1 = new Date(d.getFullYear(), 0, 4);
  return 1 + Math.round(((d - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
}

function computeWeekGroups(year, month, daysInMonth) {
  const groups = [];
  let currentWeek = -1;
  let colorIdx = 0;
  for (let d = 1; d <= daysInMonth; d++) {
    const wn = getWeekNumber(year, month, d);
    if (wn !== currentWeek) {
      groups.push({ weekNum: wn, startDay: d, endDay: d, color: WEEK_COLORS[colorIdx % WEEK_COLORS.length] });
      currentWeek = wn;
      colorIdx++;
    } else {
      groups[groups.length - 1].endDay = d;
    }
  }
  groups.forEach(g => { g.colSpan = g.endDay - g.startDay + 1; });
  return groups;
}

function getDayOfWeek(year, month, day) {
  return new Date(year, month, day).getDay();
}

              <img src={user.photoURL} alt="" style={{ width: 28, height: 28, borderRadius: '50%', border: '2px solid #3B82F6' }} referrerPolicy="no-referrer" />
              {!isMobile && <span style={{ color: '#E2E8F0', fontSize: 12, maxWidth: 80, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{user.displayName?.split(' ')[0]}</span>}
            </div>
          ) : (
            <button onClick={onSignIn} className="btn btn-primary" style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 12 }}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
              {isMobile ? '' : 'Sign in'}
            </button>
          )}

          <button onClick={onOpenSettings} className="btn btn-ghost" style={{ display: 'flex', alignItems: 'center', gap: 6, padding: isMobile ? '6px 10px' : undefined }}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            {!isMobile && 'Settings'}
          </button>
        </div>

        {activeTab !== 'engine' && (
          <div style={{ position: 'relative', width: pieSize, height: pieSize }}>
            <ResponsiveContainer width="100%" height="100%">
              <PieChart>
                <Pie data={pieData} cx="50%" cy="50%" innerRadius={pieInner} outerRadius={pieOuter} dataKey="value" startAngle={90} endAngle={-270} strokeWidth={0}>
                  <Cell fill="#3B82F6" />
                  <Cell fill="#252B45" />
                </Pie>
              </PieChart>
            </ResponsiveContainer>
            <div style={{ position: 'absolute', top: '50%', left: '50%', transform: 'translate(-50%, -50%)', textAlign: 'center' }}>
              <span style={{ fontSize: isMobile ? 12 : 16, fontWeight: 700, color: '#3B82F6' }}>{overallPct}%</span>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── Dashboard Cards ──────────────────────────────────────────
function DashboardCards({ totalDone, totalPossible, bestStreak, todayScore, todayTotal }) {
  const isMobile = useIsMobile();
  const cards = [
    { title: 'Monthly Progress', value: `${totalDone} / ${totalPossible}`, sub: `${totalPossible > 0 ? Math.round((totalDone / totalPossible) * 100) : 0}% complete`, color: '#3B82F6', icon: '\u{1F4CA}' },
    { title: 'Best Streak', value: bestStreak.count > 0 ? `${bestStreak.count} days` : '\u2014', sub: bestStreak.count > 0 ? bestStreak.habit : 'No streaks yet', color: '#00B894', icon: '\u{1F525}' },
    { title: "Today's Score", value: `${todayScore} / ${todayTotal}`, sub: `${todayTotal > 0 ? Math.round((todayScore / todayTotal) * 100) : 0}%`, color: '#FFD700', icon: '\u2B50' },
  ];

  return (
    <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : 'repeat(auto-fit, minmax(220px, 1fr))', gap: isMobile ? 8 : 16, marginBottom: isMobile ? 12 : 24 }}>
      {cards.map(card => (
        <div key={card.title} className="animate-in dashboard-card" style={{ padding: isMobile ? '12px 16px' : '20px 24px', borderLeft: `4px solid ${card.color}` }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: isMobile ? 'center' : 'start', marginBottom: isMobile ? 0 : 8 }}>
            <span style={{ color: '#94A3B8', fontSize: isMobile ? 11 : 13, fontWeight: 500 }}>{card.title}</span>
            {isMobile ? (
              <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                <span style={{ fontSize: 16, fontWeight: 700, color: '#E2E8F0' }}>{card.value}</span>
                <span style={{ fontSize: 14 }}>{card.icon}</span>
              </div>
            ) : (
              <span style={{ fontSize: 20 }}>{card.icon}</span>
            )}
          </div>
          {!isMobile && <div style={{ fontSize: 24, fontWeight: 700, color: '#E2E8F0', marginBottom: 4 }}>{card.value}</div>}
          {!isMobile && <div style={{ color: '#94A3B8', fontSize: 12 }}>{card.sub}</div>}
        </div>
      ))}
    </div>
  );
}

// ─── Daily Chart ──────────────────────────────────────────────
function DailyChart({ dailyData }) {
  const isMobile = useIsMobile();
  return (
    <div className="dashboard-card" style={{ padding: isMobile ? 12 : 24, marginBottom: isMobile ? 12 : 24 }}>
      <h2 style={{ fontSize: isMobile ? 15 : 18, fontWeight: 600, color: '#E2E8F0', marginBottom: isMobile ? 8 : 16 }}>Daily Completion Rate</h2>
      <ResponsiveContainer width="100%" height={isMobile ? 160 : 250}>
        <AreaChart data={dailyData} margin={{ top: 5, right: 20, left: 0, bottom: 5 }}>
          <defs>
            <linearGradient id="colorPct" x1="0" y1="0" x2="0" y2="1">
              <stop offset="5%" stopColor="#3B82F6" stopOpacity={0.3} />
              <stop offset="95%" stopColor="#3B82F6" stopOpacity={0} />
            </linearGradient>
          </defs>
          <CartesianGrid strokeDasharray="3 3" stroke="#252B45" />
          <XAxis dataKey="day" stroke="#94A3B8" fontSize={12} tickLine={false} />
          <YAxis stroke="#94A3B8" fontSize={12} tickLine={false} domain={[0, 100]} tickFormatter={v => `${v}%`} />
          <Tooltip contentStyle={{ background: '#1A1F35', border: '1px solid #252B45', borderRadius: 8, color: '#E2E8F0' }} labelFormatter={v => `Day ${v}`} formatter={v => [`${v}%`, 'Completion']} />
          <ReferenceLine y={80} stroke="#FFD700" strokeDasharray="5 5" label={{ value: '80% goal', fill: '#FFD700', fontSize: 11, position: 'right' }} />
          <Area type="monotone" dataKey="pct" stroke="#3B82F6" strokeWidth={2} fill="url(#colorPct)" dot={{ fill: '#3B82F6', r: 3 }} activeDot={{ r: 5, fill: '#3B82F6' }} />
        </AreaChart>
      </ResponsiveContainer>
    </div>
  );
}

// ─── Habit Grid ───────────────────────────────────────────────
function HabitGrid({ config, checks, metrics, toggleCheck, setMetric, collapsed, toggleCollapse, daysInMonth, habitStats, month, year }) {
  const isMobile = useIsMobile();
  const days = Array.from({ length: daysInMonth }, (_, i) => i + 1);
  const NAME_W = isMobile ? 100 : 150;
  const CELL_W = isMobile ? 36 : 28;
  const CELL_GAP = 1;
  const STATS_W = isMobile ? 0 : 196;
  const MONDAY_SEP = isMobile ? 2 : 6;

  const now = new Date();
  const isCurrentMonth = month === now.getMonth() && year === now.getFullYear();
  const today = isCurrentMonth ? now.getDate() : -1;
  const isFutureMonth = year > now.getFullYear() || (year === now.getFullYear() && month > now.getMonth());

  const weekGroups = useMemo(() => computeWeekGroups(year, month, daysInMonth), [year, month, daysInMonth]);

  // Map day -> week color for quick lookup
  const dayWeekColor = useMemo(() => {
    const map = {};
    weekGroups.forEach(g => {
      for (let d = g.startDay; d <= g.endDay; d++) map[d] = g.color;
    });
    return map;
  }, [weekGroups]);

  // Check-based habits for summary rows (all non-number types)
  const boolHabits = useMemo(() =>
    config.categories.flatMap(c => c.habits.filter(h => h.type !== 'number')),
    [config]
  );

  // Per-day summary stats (accounts for specific_days active/inactive)
  const daySummary = useMemo(() => {
    const result = {};
    days.forEach(d => {
      let completed = 0, total = 0;
      boolHabits.forEach(h => {
        // For specific_days, only count if this day is active
        if (h.type === 'specific_days' && !(h.activeDays || []).includes(getDayOfWeek(year, month, d))) return;
        total++;
        if (checks[cellKey(h.id, d)]) completed++;
      });
      result[d] = { completed, incomplete: total - completed, pct: total > 0 ? Math.round((completed / total) * 100) : 0 };
    });
    return result;
  }, [days, boolHabits, checks, year, month]);

  // Compute total grid width for day columns (no flex stretch)
  const mondayCount = days.filter(d => getDayOfWeek(year, month, d) === 1 && d > 1).length;
  const DAYS_W = daysInMonth * (CELL_W + CELL_GAP) - CELL_GAP + mondayCount * MONDAY_SEP;

  return (
    <div className="dashboard-card" style={{ marginBottom: isMobile ? 12 : 24, paddingBottom: isMobile ? 0 : 4 }}>
      <h2 style={{ fontSize: isMobile ? 15 : 18, fontWeight: 600, color: '#E2E8F0', marginBottom: isMobile ? 8 : 16, padding: isMobile ? '12px 8px 0' : '24px 16px 0' }}>Habit Grid</h2>
      <div style={{ overflowX: 'auto', padding: isMobile ? '0 0 12px 0' : '0 16px 24px 16px', WebkitOverflowScrolling: 'touch' }}>
      <div style={{ display: 'inline-flex', flexDirection: 'column', minWidth: '100%' }}>
        {/* Week band header row */}
        <div style={{ display: 'flex', alignItems: 'center', marginBottom: 0, minHeight: 24 }}>
          <div className="freeze-col" style={{ width: NAME_W, minWidth: NAME_W, flexShrink: 0, paddingRight: 4, display: 'flex', alignItems: 'center' }} />
          <div style={{ display: 'flex', gap: 0, width: DAYS_W, minWidth: DAYS_W, flexShrink: 0 }}>
            {weekGroups.map((g, gi) => {
              // Calculate total width: colSpan cells + gaps + Monday separators
              let totalW = g.colSpan * (CELL_W + CELL_GAP) - CELL_GAP;
              // Add Monday separator gap for any Monday in this group (except day 1)
              for (let d = g.startDay; d <= g.endDay; d++) {
                const dow = getDayOfWeek(year, month, d);
                if (dow === 1 && d > 1) totalW += MONDAY_SEP;
              }
              return (
                <div key={g.weekNum} style={{
                  width: totalW, minWidth: totalW, textAlign: 'center',
                  background: g.color + '30', color: g.color,
                  fontSize: 12, fontWeight: 700, padding: '4px 0',
                  borderRadius: gi === 0 ? '4px 0 0 4px' : gi === weekGroups.length - 1 ? '0 4px 4px 0' : 0,
                  borderRight: gi < weekGroups.length - 1 ? '1px solid #1A1F35' : 'none',
                  marginLeft: gi > 0 ? 1 : 0,
                }}>
                  Wk {g.weekNum}
                </div>
              );
            })}
          </div>
          {!isMobile && <div style={{ width: STATS_W, minWidth: STATS_W, flexShrink: 0, marginLeft: 8 }} />}
        </div>

        {/* Day-of-week header row */}
        <div style={{ display: 'flex', alignItems: 'center', marginBottom: 0, minHeight: 24 }}>
          <div className="freeze-col" style={{ width: NAME_W, minWidth: NAME_W, flexShrink: 0, paddingRight: 4, display: 'flex', alignItems: 'center' }} />
          <div style={{ display: 'flex', gap: CELL_GAP, width: DAYS_W, minWidth: DAYS_W, flexShrink: 0 }}>
            {days.map(d => {
              const dow = getDayOfWeek(year, month, d);
              const isMonday = dow === 1 && d > 1;
              const isWeekend = dow === 0 || dow === 6;
              const wc = dayWeekColor[d];
              return (
                <div key={d} style={{
                  width: CELL_W, minWidth: CELL_W, textAlign: 'center',
                  color: isWeekend ? '#E9456080' : wc + 'AA',
                  fontSize: 11, fontWeight: isWeekend ? 700 : 500,
                  marginLeft: isMonday ? MONDAY_SEP : 0,
                  background: wc + '10', borderRadius: 2,
                }}>
                  {DAY_ABBR[dow]}
                </div>
              );
            })}
          </div>
          {!isMobile && <div style={{ width: STATS_W, minWidth: STATS_W, flexShrink: 0, marginLeft: 8 }} />}
        </div>

        {/* Day number header row */}
        <div style={{ display: 'flex', alignItems: 'center', marginBottom: 4, minHeight: 24 }}>
          <div className="freeze-col" style={{ width: NAME_W, minWidth: NAME_W, flexShrink: 0, paddingRight: 4, display: 'flex', alignItems: 'center' }}>
            <span style={{ color: '#94A3B8', fontSize: 12, fontWeight: 600 }}>HABIT</span>
          </div>
          <div style={{ display: 'flex', gap: CELL_GAP, width: DAYS_W, minWidth: DAYS_W, flexShrink: 0 }}>
            {days.map(d => {
              const dow = getDayOfWeek(year, month, d);
              const isMonday = dow === 1 && d > 1;
              const isToday = d === today;
              const wc = dayWeekColor[d];
              return (
                <div key={d} style={{
                  width: CELL_W, minWidth: CELL_W, textAlign: 'center', fontSize: 12, fontWeight: isToday ? 700 : 500,
                  color: isToday ? '#fff' : wc + 'BB',
                  marginLeft: isMonday ? MONDAY_SEP : 0,
                  background: wc + '10', borderRadius: 2,
                }}>
                  {isToday ? (
                    <span style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', width: 20, height: 20, borderRadius: '50%', background: '#3B82F6', fontSize: 12, fontWeight: 700, color: '#fff' }}>{d}</span>
                  ) : d}
                </div>
              );
            })}
          </div>
          {!isMobile && <div style={{ display: 'flex', marginLeft: 8, width: STATS_W, minWidth: STATS_W, flexShrink: 0 }}>
            <span style={{ color: '#94A3B8', fontSize: 11, fontWeight: 600, width: 36, textAlign: 'center' }}>SUM</span>
            <span style={{ color: '#94A3B8', fontSize: 11, fontWeight: 600, width: 36, textAlign: 'center', borderLeft: '1px solid #374151', paddingLeft: 4 }}>GOAL</span>
            <span style={{ color: '#94A3B8', fontSize: 11, fontWeight: 600, width: 72, textAlign: 'center', borderLeft: '1px solid #374151', paddingLeft: 4 }}>PROG</span>
            <span style={{ color: '#94A3B8', fontSize: 11, fontWeight: 600, width: 44, textAlign: 'center', borderLeft: '1px solid #374151', paddingLeft: 4 }}>STREAK</span>
          </div>}
        </div>

        {config.categories.map(cat => {
          const isCollapsed = collapsed.has(cat.id);
          return (
            <div key={cat.id}>
              <div className="category-row" onClick={() => toggleCollapse(cat.id)} style={{ borderBottom: `2px solid ${cat.color}20` }}>
                <div className="freeze-col" style={{ width: NAME_W, minWidth: NAME_W, flexShrink: 0, display: 'flex', alignItems: 'center', gap: 6 }}>
                  <span style={{ color: cat.color, fontSize: 9, transform: isCollapsed ? 'rotate(-90deg)' : 'rotate(0deg)', transition: 'transform 200ms', display: 'inline-block' }}>{'\u25BC'}</span>
                  <span style={{ color: cat.color, fontSize: 12, fontWeight: 700, textTransform: 'uppercase', letterSpacing: 1 }}>{cat.name}</span>
                </div>
              </div>

              {!isCollapsed && cat.habits.map(habit => {
                const stats = habitStats[habit.id] || { done: 0, pct: 0, remaining: 0, streak: 0, sum: 0, avg: 0, entries: 0 };
                const isNumber = habit.type === 'number';
                const sumVal = isNumber ? (stats.entries > 0 ? stats.avg : '\u2014') : stats.done;
                const goalVal = isNumber ? (habit.goal || '\u2014') : (stats.goal || daysInMonth);
                return (
                  <div key={habit.id} className="habit-row">
                    <div className="freeze-col" style={{ width: NAME_W, minWidth: NAME_W, flexShrink: 0, paddingRight: 4, display: 'flex', alignItems: 'center', gap: 4, overflow: 'hidden' }}>
                      <span style={{ color: '#E2E8F0', fontSize: isMobile ? 11 : 12, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{habit.name}</span>
                      {isNumber && (
                        <span style={{ color: '#94A3B8', fontSize: 9, flexShrink: 0 }}>{habit.unit}</span>
                      )}
                      {habit.type === 'per_week' && (
                        <span style={{ color: '#94A3B8', fontSize: 9, flexShrink: 0 }}>{habit.perWeek}x/wk</span>
                      )}
                      {habit.type === 'per_month' && (
                        <span style={{ color: '#94A3B8', fontSize: 9, flexShrink: 0 }}>{habit.perMonth}x/mo</span>
                      )}
                    </div>
                    <div style={{ display: 'flex', gap: CELL_GAP, width: DAYS_W, minWidth: DAYS_W, flexShrink: 0 }}>
                      {days.map(d => {
                        const key = cellKey(habit.id, d);
                        const dow = getDayOfWeek(year, month, d);
                        const isMonday = dow === 1 && d > 1;
                        const isToday = d === today;
                        const isFuture = isFutureMonth || (isCurrentMonth && d > today);
                        const todayBg = isToday ? 'rgba(59,130,246,0.08)' : undefined;
                        const weekTint = dayWeekColor[d] + '0D'; // ~5% opacity
                        if (isNumber) {
                          const val = metrics[key];
                          return (
                            <input
                              key={d}
                              type="text"
                              inputMode="decimal"
                              disabled={isFuture}
                              style={{
                                width: CELL_W, minWidth: CELL_W, height: 26,
                                background: isFuture ? '#1A1F35' : (val !== undefined && val !== '' ? 'rgba(59,130,246,0.15)' : (todayBg || weekTint)),
                                color: '#E2E8F0', border: `1px solid ${val !== undefined && val !== '' ? '#3B82F6' : '#374151'}`,
                                borderRadius: 3, textAlign: 'center', fontSize: 10, outline: 'none', padding: 0,
                                opacity: isFuture ? 0.3 : 1, cursor: isFuture ? 'not-allowed' : 'text',
                                marginLeft: isMonday ? MONDAY_SEP : 0, borderLeft: isMonday ? '2px solid #374151' : undefined,
                              }}
                              value={val !== undefined ? val : ''}
                              onChange={e => {
                                const v = e.target.value;
                                if (v === '' || /^-?\d*\.?\d*$/.test(v)) {
                                  setMetric(key, v === '' ? undefined : v);
                                }
                              }}
                              onBlur={e => {
                                const v = e.target.value;
                                if (v !== '' && !isNaN(parseFloat(v))) {
                                  setMetric(key, parseFloat(v));
                                } else if (v === '') {
                                  setMetric(key, undefined);
                                }
                              }}
                            />
                          );
                        }
                        const checked = !!checks[key];
                        const isInactive = habit.type === 'specific_days' && !(habit.activeDays || []).includes(dow);
                        const isDisabled = isFuture || isInactive;
                        return (
                          <div key={d} onClick={() => !isDisabled && toggleCheck(key)} style={{
                            width: CELL_W, minWidth: CELL_W, height: 26, display: 'flex', alignItems: 'center', justifyContent: 'center',
                            cursor: isDisabled ? 'not-allowed' : 'pointer', borderRadius: 3,
                            background: isInactive ? '#151929' : (isFuture ? '#1A1F35' : (checked ? `${cat.color}25` : (todayBg || weekTint))),
                            boxShadow: `inset 0 0 0 1px ${checked && !isInactive ? cat.color : '#374151'}`,
                            transition: 'all 150ms',
                            opacity: isDisabled ? 0.25 : 1,
                            marginLeft: isMonday ? MONDAY_SEP : 0, borderLeft: isMonday ? '2px solid #374151' : undefined,
                          }}>
                            {checked && !isInactive && <span style={{ color: cat.color, fontSize: 13, fontWeight: 700 }}>{'\u2713'}</span>}
                          </div>
                        );
                      })}
                    </div>
                    {!isMobile && <div style={{ display: 'flex', marginLeft: 8, alignItems: 'center', width: STATS_W, minWidth: STATS_W, flexShrink: 0 }}>
                      <span style={{ color: '#E2E8F0', fontSize: 11, fontWeight: 600, width: 36, textAlign: 'center' }}>
                        {isNumber ? (typeof sumVal === 'number' ? (sumVal % 1 === 0 ? sumVal : sumVal.toFixed(1)) : sumVal) : sumVal}
                      </span>
                      <span style={{ color: '#94A3B8', fontSize: 11, width: 36, textAlign: 'center', borderLeft: '1px solid #374151', paddingLeft: 4 }}>
                        {goalVal}
                      </span>
                      <div style={{ width: 72, display: 'flex', alignItems: 'center', gap: 3, borderLeft: '1px solid #374151', paddingLeft: 4 }}>
                        <div style={{ width: 46, height: 7, background: '#252B45', borderRadius: 3, overflow: 'hidden' }}>
                          <div style={{ height: '100%', borderRadius: 3, background: cat.color, width: `${Math.min(stats.pct, 100)}%`, transition: 'width 300ms ease' }} />
                        </div>
                        <span style={{ color: '#94A3B8', fontSize: 10, width: 24 }}>{stats.pct}%</span>
                      </div>
                      <div style={{ borderLeft: '1px solid #374151', paddingLeft: 4, width: 44, display: 'flex', justifyContent: 'center' }}>
                        {stats.streak >= 2 ? (
                          <span className="streak-badge">{'\u{1F525}'}{stats.streak}</span>
                        ) : null}
                      </div>
                    </div>}
                  </div>
                );
              })}
            </div>
          );
        })}

        {/* ── Summary Rows ── */}
        {boolHabits.length > 0 && (
          <div style={{ borderTop: '2px solid #374151', marginTop: 8, paddingTop: 6 }}>
            {/* Completed per day */}
            <div className="summary-row">
              <div className="freeze-col" style={{ width: NAME_W, minWidth: NAME_W, flexShrink: 0, paddingRight: 4, display: 'flex', alignItems: 'center' }}>
                <span style={{ color: '#10B981', fontSize: 11, fontWeight: 600 }}>COMPLETED</span>
              </div>
              <div style={{ display: 'flex', gap: CELL_GAP, width: DAYS_W, minWidth: DAYS_W, flexShrink: 0 }}>
                {days.map(d => {
                  const isMonday = getDayOfWeek(year, month, d) === 1 && d > 1;
                  return (
                    <div key={d} style={{ width: CELL_W, minWidth: CELL_W, textAlign: 'center', fontSize: 11, color: '#10B981', fontWeight: 600, marginLeft: isMonday ? MONDAY_SEP : 0 }}>
                      {daySummary[d].completed}
                    </div>
                  );
                })}
              </div>
              {!isMobile && <div style={{ width: STATS_W, minWidth: STATS_W, flexShrink: 0, marginLeft: 8 }}>
                <span style={{ color: '#10B981', fontSize: 11, fontWeight: 700, display: 'inline-block', width: 36, textAlign: 'center' }}>
                  {Object.values(daySummary).reduce((a, s) => a + s.completed, 0)}
                </span>
              </div>}
            </div>

            {/* Incomplete per day */}
            <div className="summary-row">
              <div className="freeze-col" style={{ width: NAME_W, minWidth: NAME_W, flexShrink: 0, paddingRight: 4, display: 'flex', alignItems: 'center' }}>
                <span style={{ color: '#EF4444', fontSize: 11, fontWeight: 600 }}>INCOMPLETE</span>
              </div>
              <div style={{ display: 'flex', gap: CELL_GAP, width: DAYS_W, minWidth: DAYS_W, flexShrink: 0 }}>
                {days.map(d => {
                  const isMonday = getDayOfWeek(year, month, d) === 1 && d > 1;
                  return (
                    <div key={d} style={{ width: CELL_W, minWidth: CELL_W, textAlign: 'center', fontSize: 11, color: '#EF4444', fontWeight: 600, marginLeft: isMonday ? MONDAY_SEP : 0 }}>
                      {daySummary[d].incomplete}
                    </div>
                  );
                })}
              </div>
              {!isMobile && <div style={{ width: STATS_W, minWidth: STATS_W, flexShrink: 0, marginLeft: 8 }}>
                <span style={{ color: '#EF4444', fontSize: 11, fontWeight: 700, display: 'inline-block', width: 36, textAlign: 'center' }}>
                  {Object.values(daySummary).reduce((a, s) => a + s.incomplete, 0)}
                </span>
              </div>}
            </div>

            {/* Daily % */}
            <div className="summary-row">
              <div className="freeze-col" style={{ width: NAME_W, minWidth: NAME_W, flexShrink: 0, paddingRight: 4, display: 'flex', alignItems: 'center' }}>
                <span style={{ color: '#94A3B8', fontSize: 11, fontWeight: 600 }}>DAILY %</span>
              </div>
              <div style={{ display: 'flex', gap: CELL_GAP, width: DAYS_W, minWidth: DAYS_W, flexShrink: 0 }}>
                {days.map(d => {
                  const isMonday = getDayOfWeek(year, month, d) === 1 && d > 1;
                  const pct = daySummary[d].pct;
                  return (
                    <div key={d} style={{ width: CELL_W, minWidth: CELL_W, textAlign: 'center', fontSize: 10, color: '#E2E8F0', fontWeight: 600, marginLeft: isMonday ? MONDAY_SEP : 0 }}>
                      {pct}%
                    </div>
                  );
                })}
              </div>
              {!isMobile && <div style={{ width: STATS_W, minWidth: STATS_W, flexShrink: 0, marginLeft: 8 }} />}
            </div>

            {/* Weekly summary row */}
            <div className="summary-row" style={{ marginTop: 2 }}>
              <div className="freeze-col" style={{ width: NAME_W, minWidth: NAME_W, flexShrink: 0, paddingRight: 4, display: 'flex', alignItems: 'center' }}>
                <span style={{ color: '#94A3B8', fontSize: 11, fontWeight: 600 }}>WEEKLY</span>
              </div>
              <div style={{ display: 'flex', gap: 0, width: DAYS_W, minWidth: DAYS_W, flexShrink: 0 }}>
                {weekGroups.map((g, gi) => {
                  let totalW = g.colSpan * (CELL_W + CELL_GAP) - CELL_GAP;
                  for (let d = g.startDay; d <= g.endDay; d++) {
                    if (getDayOfWeek(year, month, d) === 1 && d > 1) totalW += MONDAY_SEP;
                  }
                  let weekCompleted = 0, weekTotal = 0;
                  for (let d = g.startDay; d <= g.endDay; d++) {
                    weekCompleted += daySummary[d].completed;
                    weekTotal += daySummary[d].completed + daySummary[d].incomplete;
                  }
                  const weekPct = weekTotal > 0 ? Math.round((weekCompleted / weekTotal) * 100) : 0;
                  return (
                    <div key={g.weekNum} style={{
                      width: totalW, minWidth: totalW, textAlign: 'center',
                      background: g.color + '20', color: g.color,
                      fontSize: 11, fontWeight: 700, padding: '4px 0',
                      borderRadius: gi === 0 ? '3px 0 0 3px' : gi === weekGroups.length - 1 ? '0 3px 3px 0' : 0,
                      borderRight: gi < weekGroups.length - 1 ? '1px solid #1A1F35' : 'none',
                      marginLeft: gi > 0 ? 1 : 0,
                    }}>
                      {weekCompleted}/{weekTotal} ({weekPct}%)
                    </div>
                  );
                })}
              </div>
              {!isMobile && <div style={{ width: STATS_W, minWidth: STATS_W, flexShrink: 0, marginLeft: 8 }} />}
            </div>
          </div>
        )}
      </div>
      </div>
    </div>
  );
}

// ─── Monthly & Weekly Goals ──────────────────────────────────
function GoalsPanel({ goals, setGoals }) {
  const save = (updated) => { setGoals(updated); };

  const updateGoal = (type, id, field, value) => {
    const updated = { ...goals, [type]: goals[type].map(g => g.id === id ? { ...g, [field]: value } : g) };
    save(updated);
  };

  const addGoal = (type) => {
    if (goals[type].length >= 5) return;
    const nextId = Math.max(0, ...goals[type].map(g => g.id)) + 1;
    save({ ...goals, [type]: [...goals[type], { id: nextId, text: '', done: false }] });
  };

  const removeGoal = (type, id) => {
    if (goals[type].length <= 1) return;
    save({ ...goals, [type]: goals[type].filter(g => g.id !== id) });
  };

  const renderSection = (title, type, color) => {
    const items = goals[type];
    const doneCount = items.filter(g => g.done && g.text.trim()).length;
    const totalWithText = items.filter(g => g.text.trim()).length;
    return (
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <span style={{ color, fontSize: 14, fontWeight: 700 }}>{title}</span>
            {totalWithText > 0 && (
              <span style={{ color: '#94A3B8', fontSize: 11 }}>{doneCount}/{totalWithText}</span>
            )}
          </div>
          {items.length < 5 && (
            <button onClick={() => addGoal(type)} style={{
              background: 'none', border: `1px solid ${color}40`, color, fontSize: 11,
              borderRadius: 4, padding: '2px 8px', cursor: 'pointer',
            }}>+ Add</button>
          )}
        </div>
        {items.map((g, i) => (
          <div key={g.id} style={{
            display: 'flex', alignItems: 'center', gap: 8, padding: '6px 0',
            borderBottom: i < items.length - 1 ? '1px solid #252B45' : 'none',
          }}>
            <div
              onClick={() => updateGoal(type, g.id, 'done', !g.done)}
              style={{
                width: 20, height: 20, borderRadius: 4, flexShrink: 0, cursor: 'pointer',
                border: `2px solid ${g.done ? color : '#374151'}`,
                background: g.done ? color + '25' : 'transparent',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
              }}
            >
              {g.done && <span style={{ color, fontSize: 12, fontWeight: 700 }}>{'\u2713'}</span>}
            </div>
            <input
              type="text"
              value={g.text}
              onChange={e => updateGoal(type, g.id, 'text', e.target.value)}
              placeholder={`${title.split(' ')[0]} goal ${i + 1}...`}
              style={{
                flex: 1, background: 'transparent', border: 'none', outline: 'none',
                color: g.done ? '#94A3B8' : '#E2E8F0', fontSize: 13,
                textDecoration: g.done ? 'line-through' : 'none',
              }}
            />
            {items.length > 1 && (
              <span onClick={() => removeGoal(type, g.id)} style={{ color: '#94A3B840', fontSize: 14, cursor: 'pointer', flexShrink: 0 }}>{'\u00D7'}</span>
            )}
          </div>
        ))}
      </div>
    );
  };

  return (
    <div className="dashboard-card" style={{ padding: 24, marginBottom: 24 }}>
      <h2 style={{ fontSize: 18, fontWeight: 600, color: '#E2E8F0', marginBottom: 16 }}>Goals</h2>
      <div style={{ display: 'flex', gap: 32, flexWrap: 'wrap' }}>
        {renderSection('Monthly Goals', 'monthly', '#3B82F6')}
        {renderSection('Weekly Goals', 'weekly', '#10B981')}
      </div>
    </div>
  );
}

// ─── Metrics Dashboard ────────────────────────────────────────
function buildAllTimeMetricSeries(habitId) {
  // Discover every month bucket currently in localStorage (dd-metrics-YYYY-MM)
  const months = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    const m = k && k.match(/^dd-metrics-(\d{4})-(\d{2})$/);
    if (m) months.push({ y: +m[1], mo: +m[2] - 1 });
  }
  months.sort((a, b) => a.y - b.y || a.mo - b.mo);

  const bucketCache = {};
  const getBucket = (y, mo) => {
    const k = `${y}-${mo}`;
    if (!(k in bucketCache)) bucketCache[k] = loadMetrics(y, mo);
    return bucketCache[k];
  };

  // Find earliest recorded date for this habit + collect all-time values for min/max
  let firstDate = null;
  const allValues = [];
  for (const { y, mo } of months) {
    const bucket = getBucket(y, mo);
    const daysInMonth = new Date(y, mo + 1, 0).getDate();
    for (let d = 1; d <= daysInMonth; d++) {
      const raw = bucket[cellKey(habitId, d)];
      if (raw === undefined || raw === '') continue;
      const n = typeof raw === 'number' ? raw : parseFloat(raw);
      if (isNaN(n)) continue;
      allValues.push(n);
      if (!firstDate) firstDate = new Date(y, mo, d);
    }
  }

  if (!firstDate) return { series: [], totalDays: 0, yMin: null, yMax: null };

  const today = new Date(); today.setHours(0, 0, 0, 0);
  firstDate.setHours(0, 0, 0, 0);

  // Walk day-by-day from firstDate → today, carry-forward missing days
  const series = [];
  let lastVal = null;
  const msPerDay = 86400000;
  const totalDays = Math.max(1, Math.round((today - firstDate) / msPerDay) + 1);
  for (let i = 0; i < totalDays; i++) {
    const d = new Date(firstDate); d.setDate(firstDate.getDate() + i);
    const bucket = getBucket(d.getFullYear(), d.getMonth());
    const raw = bucket[cellKey(habitId, d.getDate())];
    const num = raw === undefined || raw === '' ? NaN : (typeof raw === 'number' ? raw : parseFloat(raw));
    if (!isNaN(num)) lastVal = num;
    series.push({
      label: `${d.getMonth() + 1}/${d.getDate()}`,
      fullLabel: d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }),
      value: lastVal,
      hasEntry: !isNaN(num),
    });
  }

  // 7-day rolling average (over carried-forward values, ignoring nulls)
  for (let i = 0; i < series.length; i++) {
    let sum = 0, count = 0;
    for (let j = Math.max(0, i - 6); j <= i; j++) {
      if (series[j].value != null && !isNaN(series[j].value)) { sum += series[j].value; count++; }
    }
    series[i].avg7 = count > 0 ? +(sum / count).toFixed(2) : null;
  }

  // Y-axis range: pad all-time min/max by ~10%
  const rawMin = Math.min(...allValues);
  const rawMax = Math.max(...allValues);
  const range = rawMax - rawMin;
  const pad = range > 0 ? range * 0.1 : Math.abs(rawMax) * 0.05 || 1;
  return { series, totalDays, yMin: rawMin - pad, yMax: rawMax + pad };
}

function MetricCard({ habit, metrics }) {
  const isMobile = useIsMobile();
  const windowDays = isMobile ? 14 : 30;
  const chartH = isMobile ? 140 : 180;
  const sharedMargin = { top: 5, right: 12, left: 0, bottom: 5 };

  const { series, totalDays, yMin, yMax } = useMemo(
    () => buildAllTimeMetricSeries(habit.id),
    // eslint-disable-next-line react-hooks/exhaustive-deps
    [habit.id, metrics]
  );

  const scrollRef = useRef(null);
  const [visibleRange, setVisibleRange] = useState({
    start: Math.max(0, totalDays - windowDays),
    end: totalDays,
  });

  // Snap to today (rightmost) on mount and whenever series length or window changes
  useEffect(() => {
    if (scrollRef.current) {
      scrollRef.current.scrollLeft = scrollRef.current.scrollWidth;
    }
    setVisibleRange({
      start: Math.max(0, totalDays - windowDays),
      end: totalDays,
    });
  }, [totalDays, windowDays]);

  const onScroll = () => {
    const el = scrollRef.current;
    if (!el || totalDays === 0) return;
    const leftPct = el.scrollWidth > 0 ? el.scrollLeft / el.scrollWidth : 0;
    const start = Math.max(0, Math.min(totalDays - windowDays, Math.floor(leftPct * totalDays)));
    const end = Math.min(totalDays, start + windowDays);
    setVisibleRange({ start, end });
  };

  // Drag-to-pan
  const dragState = useRef({ dragging: false, startX: 0, startScroll: 0 });
  const onMouseDown = (e) => {
    if (!scrollRef.current) return;
    dragState.current = {
      dragging: true,
      startX: e.pageX,
      startScroll: scrollRef.current.scrollLeft,
    };
    scrollRef.current.style.cursor = 'grabbing';
    scrollRef.current.style.userSelect = 'none';
  };
  useEffect(() => {
    const move = (e) => {
      if (!dragState.current.dragging || !scrollRef.current) return;
      e.preventDefault();
      scrollRef.current.scrollLeft = dragState.current.startScroll - (e.pageX - dragState.current.startX);
    };
    const up = () => {
      if (!dragState.current.dragging) return;
      dragState.current.dragging = false;
      if (scrollRef.current) {
        scrollRef.current.style.cursor = 'grab';
        scrollRef.current.style.userSelect = '';
      }
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
    return () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
  }, []);

  // Header stats reflect visible window
  const visibleSlice = series.slice(visibleRange.start, visibleRange.end);
  const firstVal = visibleSlice.find(p => p.value != null && !isNaN(p.value))?.value ?? null;
  const lastVal = [...visibleSlice].reverse().find(p => p.value != null && !isNaN(p.value))?.value ?? null;
  const trend = firstVal !== null && lastVal !== null ? lastVal - firstVal : 0;
  const trendColor = habit.direction === 'down'
    ? (trend <= 0 ? '#00B894' : '#E94560')
    : (trend >= 0 ? '#00B894' : '#E94560');

  const hasAnyData = totalDays > 0 && yMin !== null;
  const canScroll = totalDays > windowDays;
  const innerWidthPct = canScroll ? (totalDays / windowDays) * 100 : 100;
  const tickInterval = Math.max(0, Math.floor(windowDays / 6) - 1);

  // Stub data for the fixed Y-axis chart so Recharts can draw it
  const yStub = hasAnyData ? [{ v: yMin }, { v: yMax }] : [{ v: 0 }];

  return (
    <div style={{ background: '#252B45', borderRadius: 10, padding: 16, borderTop: `3px solid ${habit.catColor}` }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
        <div>
          <div style={{ color: '#E2E8F0', fontSize: 15, fontWeight: 600 }}>{habit.name}</div>
          <div style={{ color: '#94A3B8', fontSize: 11 }}>{habit.catName} &middot; {habit.unit}</div>
        </div>
        {lastVal !== null && (
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 6 }}>
            <span style={{ color: '#E2E8F0', fontSize: 18, fontWeight: 700 }}>{lastVal.toFixed(1)}</span>
            <span style={{ color: trendColor, fontSize: 12, fontWeight: 700 }}>
              {trend > 0 ? '+' : ''}{trend.toFixed(1)}
            </span>
            <span style={{ fontSize: 11, color: '#94A3B8' }}>{habit.unit}</span>
          </div>
        )}
      </div>

      {!hasAnyData ? (
        <div style={{ color: '#94A3B8', fontSize: 12, fontStyle: 'italic' }}>No entries yet</div>
      ) : (
        <>
          <div style={{ display: 'flex', alignItems: 'stretch' }}>
            {/* Fixed Y-axis (non-scrolling) */}
            <div style={{ width: 44, flexShrink: 0 }}>
              <ResponsiveContainer width="100%" height={chartH}>
                <LineChart data={yStub} margin={sharedMargin}>
                  <YAxis
                    stroke="#94A3B8"
                    fontSize={11}
                    tickLine={false}
                    axisLine={false}
                    domain={[yMin, yMax]}
                    tickFormatter={v => Number(v).toFixed(1)}
                    width={44}
                  />
                  <Line dataKey="v" stroke="transparent" dot={false} />
                </LineChart>
              </ResponsiveContainer>
            </div>

            {/* Scrollable line chart */}
            <div
              ref={scrollRef}
              onScroll={onScroll}
              onMouseDown={onMouseDown}
              className="metric-scroll"
              style={{
                flex: 1,
                overflowX: canScroll ? 'auto' : 'hidden',
                overflowY: 'hidden',
                cursor: canScroll ? 'grab' : 'default',
                touchAction: 'pan-x',
              }}
            >
              <div style={{ width: `${innerWidthPct}%`, minWidth: '100%', height: chartH }}>
                <ResponsiveContainer width="100%" height={chartH}>
                  <LineChart data={series} margin={sharedMargin}>
                    <CartesianGrid strokeDasharray="3 3" stroke="#252B45" />
                    <XAxis dataKey="label" stroke="#94A3B8" fontSize={11} tickLine={false} interval={tickInterval} />
                    <YAxis hide domain={[yMin, yMax]} />
                    <Tooltip
                      contentStyle={{ background: '#1A1F35', border: '1px solid #252B45', borderRadius: 8, color: '#E2E8F0' }}
                      labelFormatter={(_, payload) => payload && payload[0] ? payload[0].payload.fullLabel : ''}
                      formatter={(v, name) => [v == null ? '—' : `${Number(v).toFixed(1)} ${habit.unit}`, name === 'value' ? 'Daily' : '7-day avg']}
                    />
                    <Line
                      type="monotone"
                      dataKey="value"
                      stroke={habit.catColor}
                      strokeWidth={2}
                      dot={(props) => props.payload.hasEntry
                        ? <circle cx={props.cx} cy={props.cy} r={3} fill={habit.catColor} />
                        : <g />}
                      activeDot={{ r: 5, fill: habit.catColor }}
                      connectNulls
                      isAnimationActive={false}
                    />
                    <Line
                      type="monotone"
                      dataKey="avg7"
                      stroke={habit.catColor}
                      strokeWidth={2}
                      strokeDasharray="4 4"
                      strokeOpacity={0.6}
                      dot={false}
                      connectNulls
                      isAnimationActive={false}
                    />
                  </LineChart>
                </ResponsiveContainer>
              </div>
            </div>
          </div>

          <div style={{ display: 'flex', gap: 16, marginTop: 6, fontSize: 11, color: '#94A3B8', alignItems: 'center' }}>
            <span style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
              <span style={{ width: 14, height: 2, background: habit.catColor, display: 'inline-block' }} />
              Daily
            </span>
            <span style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
              <span style={{ width: 14, height: 2, background: habit.catColor, opacity: 0.6, borderTop: `2px dashed ${habit.catColor}`, display: 'inline-block' }} />
              7-day avg
            </span>
            <span style={{ marginLeft: 'auto', fontSize: 10, color: '#64748B', fontStyle: 'italic' }}>
              {canScroll ? `← drag to scroll history · ${totalDays} days total` : `${totalDays} day${totalDays === 1 ? '' : 's'} total`}
            </span>
          </div>
        </>
      )}
    </div>
  );
}

// ─── Journal ─────────────────────────────────────────────────
function Journal({ journal, setJournal }) {
  const [draft, setDraft] = useState('');
  const [saving, setSaving] = useState(false);

  const saveEntry = () => {
    const text = draft.trim();
    if (!text) return;
    setSaving(true);
    const entry = { id: uuid(), text, date: new Date().toISOString() };
    setJournal(prev => [entry, ...prev]);
    setDraft('');
    setTimeout(() => setSaving(false), 600);
  };

  const deleteEntry = (id) => {
    setJournal(prev => prev.filter(e => e.id !== id));
  };

  const formatDate = (iso) => {
    const d = new Date(iso);
    return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  };

  return (
    <div className="dashboard-card" style={{ padding: 24, marginBottom: 24 }}>
      <h2 style={{ fontSize: 18, fontWeight: 600, color: '#E2E8F0', marginBottom: 16 }}>Journal</h2>
      <textarea
        value={draft}
        onChange={e => setDraft(e.target.value)}
        placeholder="What went well today? What can you improve?"
        style={{ width: '100%', minHeight: 90, background: '#252B45', color: '#E2E8F0', border: '1px solid #374151', borderRadius: 8, padding: 16, fontSize: 14, lineHeight: 1.6, resize: 'vertical', outline: 'none', fontFamily: 'inherit' }}
        onFocus={e => e.target.style.borderColor = '#3B82F6'}
        onBlur={e => e.target.style.borderColor = '#374151'}
        onKeyDown={e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) saveEntry(); }}
      />
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 8 }}>
        <span style={{ color: '#64748B', fontSize: 11 }}>{draft.trim() ? 'Cmd+Enter to save' : ''}</span>
        <button onClick={saveEntry} disabled={!draft.trim()} className="btn btn-primary" style={{ padding: '6px 16px', fontSize: 13, opacity: draft.trim() ? 1 : 0.5 }}>
          {saving ? 'Saved!' : 'Save Entry'}
        </button>
      </div>
      {journal.length > 0 && (
        <div style={{ marginTop: 16, maxHeight: 300, overflowY: 'auto', display: 'flex', flexDirection: 'column', gap: 8 }}>
          {journal.map(entry => (
            <div key={entry.id} style={{ background: '#252B45', borderRadius: 8, padding: '12px 16px', borderLeft: '3px solid #3B82F6' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 6 }}>
                <span style={{ color: '#94A3B8', fontSize: 11, fontWeight: 600 }}>{formatDate(entry.date)}</span>
                <button onClick={() => deleteEntry(entry.id)} style={{ background: 'none', border: 'none', color: '#64748B', cursor: 'pointer', fontSize: 12, padding: '2px 6px' }} title="Delete entry">{'\u2715'}</button>
              </div>
              <p style={{ color: '#E2E8F0', fontSize: 13, lineHeight: 1.6, whiteSpace: 'pre-wrap', margin: 0 }}>{entry.text}</p>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── Settings Panel ───────────────────────────────────────────
function SettingsPanel({ isOpen, onClose, config, setConfig, user, onSignOut }) {
  const [editingCat, setEditingCat] = useState(null);
  const [editingHabit, setEditingHabit] = useState(null);
  const [newCatName, setNewCatName] = useState('');
  const [newCatColor, setNewCatColor] = useState('#3B82F6');
  const [importText, setImportText] = useState('');
  const [showImport, setShowImport] = useState(false);
  const [confirmReset, setConfirmReset] = useState(false);

  const addCategory = () => {
    if (!newCatName.trim()) return;
    const updated = { ...config, categories: [...config.categories, { id: uuid(), name: newCatName.trim(), color: newCatColor, habits: [] }] };
    setConfig(updated);
    setNewCatName('');
  };

  const updateCategory = (catId, field, value) => {
    const updated = { ...config, categories: config.categories.map(c => c.id === catId ? { ...c, [field]: value } : c) };
    setConfig(updated);
  };

  const deleteCategory = (catId) => {
    const updated = { ...config, categories: config.categories.filter(c => c.id !== catId) };
    setConfig(updated);
  };

  const moveCat = (catId, dir) => {
    const idx = config.categories.findIndex(c => c.id === catId);
    if ((dir === -1 && idx === 0) || (dir === 1 && idx === config.categories.length - 1)) return;
    const cats = [...config.categories];
    [cats[idx], cats[idx + dir]] = [cats[idx + dir], cats[idx]];
    setConfig({ ...config, categories: cats });
  };

  const addHabit = (catId) => {
    const updated = {
      ...config,
      categories: config.categories.map(c =>
        c.id === catId ? { ...c, habits: [...c.habits, { id: uuid(), name: 'New Habit', type: 'daily' }] } : c
      ),
    };
    setConfig(updated);
  };

  const updateHabit = (catId, habitId, updates) => {
    const updated = {
      ...config,
      categories: config.categories.map(c =>
        c.id === catId ? { ...c, habits: c.habits.map(h => h.id === habitId ? { ...h, ...updates } : h) } : c
      ),
    };
    setConfig(updated);
  };

  const deleteHabit = (catId, habitId) => {
    const updated = {
      ...config,
      categories: config.categories.map(c =>
        c.id === catId ? { ...c, habits: c.habits.filter(h => h.id !== habitId) } : c
      ),
    };
    setConfig(updated);
    if (editingHabit === habitId) setEditingHabit(null);
  };

  const moveHabit = (catId, habitId, dir) => {
    const cat = config.categories.find(c => c.id === catId);
    const idx = cat.habits.findIndex(h => h.id === habitId);
    if ((dir === -1 && idx === 0) || (dir === 1 && idx === cat.habits.length - 1)) return;
    const habits = [...cat.habits];
    [habits[idx], habits[idx + dir]] = [habits[idx + dir], habits[idx]];
    const updated = { ...config, categories: config.categories.map(c => c.id === catId ? { ...c, habits } : c) };
    setConfig(updated);
  };

  const exportConfig = () => {
    const json = JSON.stringify(config, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `daily-disciplines-config-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const importConfig = () => {
    try {
      const parsed = JSON.parse(importText);
      if (parsed.categories && Array.isArray(parsed.categories)) {
        setConfig(parsed);
        setImportText('');
        setShowImport(false);
      } else {
        alert('Invalid config: must have a "categories" array');
      }
    } catch (e) {
      alert('Invalid JSON: ' + e.message);
    }
  };

  const resetDefaults = () => {
    setConfig(JSON.parse(JSON.stringify(DEFAULT_CONFIG)));
    setConfirmReset(false);
  };

  return (
    <>
      <div className={`settings-overlay ${isOpen ? 'open' : ''}`} onClick={onClose} />
      <div className={`settings-drawer ${isOpen ? 'open' : ''}`}>
        <div style={{ padding: 24 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 24 }}>
            <h2 style={{ fontSize: 20, fontWeight: 700, color: '#E2E8F0' }}>Settings</h2>
            <button onClick={onClose} className="btn btn-ghost" style={{ padding: '6px 12px' }}>{'\u2715'}</button>
          </div>

          {/* Categories */}
          <div style={{ marginBottom: 32 }}>
            <h3 style={{ color: '#94A3B8', fontSize: 12, fontWeight: 700, textTransform: 'uppercase', letterSpacing: 1, marginBottom: 12 }}>Categories & Habits</h3>

            {config.categories.map((cat, catIdx) => (
              <div key={cat.id} style={{ background: '#252B45', borderRadius: 10, padding: 16, marginBottom: 12, borderLeft: `4px solid ${cat.color}` }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
                  <input type="color" value={cat.color} onChange={e => updateCategory(cat.id, 'color', e.target.value)} style={{ width: 28, height: 28, border: 'none', borderRadius: 4, cursor: 'pointer', background: 'none' }} />
                  {editingCat === cat.id ? (
                    <input className="input" style={{ flex: 1 }} value={cat.name} onChange={e => updateCategory(cat.id, 'name', e.target.value)} onBlur={() => setEditingCat(null)} onKeyDown={e => e.key === 'Enter' && setEditingCat(null)} autoFocus />
                  ) : (
                    <span style={{ color: '#E2E8F0', fontSize: 15, fontWeight: 600, flex: 1, cursor: 'pointer' }} onClick={() => setEditingCat(cat.id)}>{cat.name}</span>
                  )}
                  <button onClick={() => moveCat(cat.id, -1)} className="btn btn-ghost" style={{ padding: '4px 8px', fontSize: 12 }} disabled={catIdx === 0}>{'\u25B2'}</button>
                  <button onClick={() => moveCat(cat.id, 1)} className="btn btn-ghost" style={{ padding: '4px 8px', fontSize: 12 }} disabled={catIdx === config.categories.length - 1}>{'\u25BC'}</button>
                  <button onClick={() => deleteCategory(cat.id)} className="btn btn-danger" style={{ padding: '4px 10px', fontSize: 12 }}>{'\u2715'}</button>
                </div>

                {/* Habits in this category */}
                <div style={{ marginLeft: 8 }}>
                  {cat.habits.map((habit, hIdx) => (
                    <div key={habit.id} style={{ padding: '6px 0', borderBottom: '1px solid #374151' }}>
                      {editingHabit === habit.id ? (
                        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                          <div style={{ display: 'flex', gap: 8 }}>
                            <input className="input" value={habit.name} onChange={e => updateHabit(cat.id, habit.id, { name: e.target.value })} placeholder="Habit name" />
                          </div>
                          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                            <select className="select" style={{ width: 'auto' }} value={habit.type} onChange={e => {
                              const newType = e.target.value;
                              const updates = { type: newType };
                              if (newType === 'number') { updates.unit = habit.unit || 'units'; updates.direction = habit.direction || 'up'; }
                              if (newType === 'specific_days' && !habit.activeDays) { updates.activeDays = [1, 2, 3, 4, 5]; }
                              if (newType === 'per_week' && !habit.perWeek) { updates.perWeek = 3; }
                              if (newType === 'per_month' && !habit.perMonth) { updates.perMonth = 10; }
                              updateHabit(cat.id, habit.id, updates);
                            }}>
                              <option value="daily">Daily</option>
                              <option value="specific_days">Specific Days</option>
                              <option value="per_week">X per Week</option>
                              <option value="per_month">X per Month</option>
                              <option value="number">Amount per Day</option>
                            </select>
                            {habit.type === 'specific_days' && (
                              <div style={{ display: 'flex', gap: 4 }}>
                                {['S','M','T','W','T','F','S'].map((label, idx) => {
                                  const active = (habit.activeDays || []).includes(idx);
                                  return (
                                    <div key={idx} onClick={() => {
                                      const current = habit.activeDays || [];
                                      const next = active ? current.filter(d => d !== idx) : [...current, idx];
                                      updateHabit(cat.id, habit.id, { activeDays: next });
                                    }} style={{
                                      width: 30, height: 30, borderRadius: 6, display: 'flex', alignItems: 'center', justifyContent: 'center',
                                      cursor: 'pointer', fontSize: 12, fontWeight: 600,
                                      background: active ? cat.color + '30' : '#1A1F35',
                                      color: active ? cat.color : '#94A3B8',
                                      border: `1px solid ${active ? cat.color : '#374151'}`,
                                    }}>{label}</div>
                                  );
                                })}
                              </div>
                            )}
                            {habit.type === 'per_week' && (
                              <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                                <input className="input" style={{ width: 60 }} type="number" min="1" max="7" value={habit.perWeek || ''} onChange={e => updateHabit(cat.id, habit.id, { perWeek: e.target.value === '' ? null : Number(e.target.value) })} />
                                <span style={{ color: '#94A3B8', fontSize: 12 }}>times per week</span>
                              </div>
                            )}
                            {habit.type === 'per_month' && (
                              <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                                <input className="input" style={{ width: 60 }} type="number" min="1" value={habit.perMonth || ''} onChange={e => updateHabit(cat.id, habit.id, { perMonth: e.target.value === '' ? null : Number(e.target.value) })} />
                                <span style={{ color: '#94A3B8', fontSize: 12 }}>times per month</span>
                              </div>
                            )}
                            {habit.type === 'number' && (
                              <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
                                <input className="input" style={{ width: 80 }} value={habit.unit || ''} onChange={e => updateHabit(cat.id, habit.id, { unit: e.target.value })} placeholder="e.g. calls" />
                                <select className="select" style={{ width: 'auto' }} value={habit.direction || 'up'} onChange={e => updateHabit(cat.id, habit.id, { direction: e.target.value })}>
                                  <option value="up">Higher is better</option>
                                  <option value="down">Lower is better</option>
                                </select>
                                <input className="input" style={{ width: 70 }} type="number" value={habit.goal ?? ''} onChange={e => updateHabit(cat.id, habit.id, { goal: e.target.value === '' ? null : Number(e.target.value) })} placeholder="Target" />
                                <span style={{ color: '#94A3B8', fontSize: 11 }}>per day</span>
                              </div>
                            )}
                          </div>
                          <button onClick={() => setEditingHabit(null)} className="btn btn-primary" style={{ alignSelf: 'flex-start', padding: '4px 12px', fontSize: 12 }}>Done</button>
                        </div>
                      ) : (
                        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                          <span style={{ color: '#E2E8F0', fontSize: 13, flex: 1, cursor: 'pointer' }} onClick={() => setEditingHabit(habit.id)}>
                            {habit.name}
                            <span style={{ color: '#94A3B8', fontSize: 11, marginLeft: 6 }}>
                              {habit.type === 'number' ? `${habit.unit || ''} \u2022 ${habit.direction || 'up'}${habit.goal ? ` \u2022 goal: ${habit.goal}` : ''}` :
                               habit.type === 'daily' ? 'daily' :
                               habit.type === 'specific_days' ? (habit.activeDays || []).map(d => ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d]).join('/') :
                               habit.type === 'per_week' ? `${habit.perWeek || 0}x/week` :
                               habit.type === 'per_month' ? `${habit.perMonth || 0}x/month` : ''}
                            </span>
                          </span>
                          <button onClick={() => moveHabit(cat.id, habit.id, -1)} className="btn btn-ghost" style={{ padding: '2px 6px', fontSize: 10 }} disabled={hIdx === 0}>{'\u25B2'}</button>
                          <button onClick={() => moveHabit(cat.id, habit.id, 1)} className="btn btn-ghost" style={{ padding: '2px 6px', fontSize: 10 }} disabled={hIdx === cat.habits.length - 1}>{'\u25BC'}</button>
                          <button onClick={() => deleteHabit(cat.id, habit.id)} className="btn btn-danger" style={{ padding: '2px 8px', fontSize: 10 }}>{'\u2715'}</button>
                        </div>
                      )}
                    </div>
                  ))}
                  <button onClick={() => addHabit(cat.id)} className="btn btn-ghost" style={{ marginTop: 8, padding: '4px 12px', fontSize: 12 }}>+ Add Habit</button>
                </div>
              </div>
            ))}

            {/* Add category */}
            <div style={{ display: 'flex', gap: 8, marginTop: 8 }}>
              <input type="color" value={newCatColor} onChange={e => setNewCatColor(e.target.value)} style={{ width: 36, height: 36, border: 'none', borderRadius: 4, cursor: 'pointer', background: 'none' }} />
              <input className="input" value={newCatName} onChange={e => setNewCatName(e.target.value)} placeholder="New category name" onKeyDown={e => e.key === 'Enter' && addCategory()} />
              <button onClick={addCategory} className="btn btn-primary">Add</button>
            </div>
          </div>

          {/* Import / Export */}
          <div style={{ marginBottom: 24 }}>
            <h3 style={{ color: '#94A3B8', fontSize: 12, fontWeight: 700, textTransform: 'uppercase', letterSpacing: 1, marginBottom: 12 }}>Backup & Restore</h3>
            <div style={{ display: 'flex', gap: 8, marginBottom: 8 }}>
              <button onClick={exportConfig} className="btn btn-ghost">Export Config</button>
              <button onClick={() => setShowImport(!showImport)} className="btn btn-ghost">Import Config</button>
            </div>
            {showImport && (
              <div style={{ marginTop: 8 }}>
                <textarea className="input" style={{ minHeight: 100, resize: 'vertical', marginBottom: 8, fontFamily: 'monospace', fontSize: 12 }} value={importText} onChange={e => setImportText(e.target.value)} placeholder="Paste JSON config here..." />
                <button onClick={importConfig} className="btn btn-primary">Apply Import</button>
              </div>
            )}
          </div>

          {/* Account */}
          {user && (
            <div style={{ marginBottom: 24 }}>
              <h3 style={{ color: '#94A3B8', fontSize: 12, fontWeight: 700, textTransform: 'uppercase', letterSpacing: 1, marginBottom: 12 }}>Account</h3>
              <div style={{ display: 'flex', alignItems: 'center', gap: 12, background: '#252B45', borderRadius: 10, padding: 16, marginBottom: 8 }}>
                <img src={user.photoURL} alt="" style={{ width: 36, height: 36, borderRadius: '50%' }} referrerPolicy="no-referrer" />
                <div style={{ flex: 1 }}>
                  <div style={{ color: '#E2E8F0', fontSize: 14, fontWeight: 600 }}>{user.displayName}</div>
                  <div style={{ color: '#94A3B8', fontSize: 12 }}>{user.email}</div>
                </div>
                <button onClick={onSignOut} className="btn btn-ghost" style={{ fontSize: 12 }}>Sign Out</button>
              </div>
              <p style={{ color: '#94A3B8', fontSize: 11 }}>Your data syncs to the cloud automatically when signed in.</p>
            </div>
          )}

          {/* Reset */}
          <div>
            <h3 style={{ color: '#94A3B8', fontSize: 12, fontWeight: 700, textTransform: 'uppercase', letterSpacing: 1, marginBottom: 12 }}>Danger Zone</h3>
            {!confirmReset ? (
              <button onClick={() => setConfirmReset(true)} className="btn btn-danger">Reset to Defaults</button>
            ) : (
              <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                <span style={{ color: '#E94560', fontSize: 13 }}>Are you sure? This resets all categories/habits.</span>
                <button onClick={resetDefaults} className="btn btn-danger">Yes, Reset</button>
                <button onClick={() => setConfirmReset(false)} className="btn btn-ghost">Cancel</button>
              </div>
            )}
          </div>
        </div>
      </div>
    </>
  );
}

// ─── Cardio Ramp by Week ────────────────────────────────────
const CARDIO_RAMP = [
  { week: 1, walks: { target: 4, duration: '30 min' }, intervals: [{ id: 'A', protocol: 'Bike: 30s hard / 90s easy x 6' }], benchmark: true },
  { week: 2, walks: { target: 5, duration: '35 min' }, intervals: [{ id: 'A', protocol: '30s hard / 90s easy x 7' }], benchmark: false },
  { week: 3, walks: { target: 5, duration: '40 min, incline' }, intervals: [{ id: 'A', protocol: '30s hard / 90s easy x 8' }], benchmark: false },
  { week: 4, walks: { target: 5, duration: '40 min, incline' }, intervals: [{ id: 'A', protocol: '30/90 x 8' }, { id: 'B', protocol: '4x4: 4 min hard / 3 min easy x 3' }], benchmark: true },
  { week: 5, walks: { target: 5, duration: '40 min, incline' }, intervals: [{ id: 'A', protocol: '30/90 x 8' }, { id: 'B', protocol: 'Norwegian 4x4: 4 min hard / 3 min easy x 4' }], benchmark: false },
  { week: 6, walks: { target: 6, duration: '45 min' }, intervals: [{ id: 'A', protocol: '40s hard / 20s easy x 8' }, { id: 'B', protocol: 'Norwegian 4x4' }], benchmark: false },
  { week: 7, walks: { target: 6, duration: '45 min + 10lb pack' }, intervals: [{ id: 'A', protocol: 'Norwegian 4x4' }, { id: 'B', protocol: '30s hard / 30s easy x 10' }], benchmark: false },
  { week: 8, walks: { target: 6, duration: '45 min, incline + pack' }, intervals: [{ id: 'A', protocol: 'Norwegian 4x4 (faster)' }, { id: 'B', protocol: '40/20 x 8' }], benchmark: true },
];

function getCardioRampForBlock(blockNumber) {
  if (blockNumber <= 1) return CARDIO_RAMP;
  const shifted = [];
  for (let w = 0; w < 8; w++) {
    const srcIdx = Math.min(w + 2, 7);
    const src = CARDIO_RAMP[srcIdx];
    shifted.push({ ...src, week: w + 1, benchmark: CARDIO_RAMP[w].benchmark });
  }
  return shifted;
}

// ─── HR Zone Calculator ─────────────────────────────────────
function computeHRZones(age) {
  const maxHR = Math.round(208 - 0.7 * age);
  return {
    maxHR,
    easy: { low: Math.round(maxHR * 0.60), high: Math.round(maxHR * 0.70) },
    moderate: { low: Math.round(maxHR * 0.70), high: Math.round(maxHR * 0.90) },
    hard: { low: Math.round(maxHR * 0.90), high: maxHR },
  };
}

// ─── Adaptive Plan Logic ────────────────────────────────────
// Determine the next strength session based on what was last completed
function getNextStrengthType(workoutLogs, startingRotation) {
  // Find the most recent completed strength log
  const strengthLogs = workoutLogs
    .filter(l => l.completed && ['push', 'pull', 'legs'].includes(l.sessionType))
    .sort((a, b) => b.logDate.localeCompare(a.logDate));

  if (strengthLogs.length === 0) {
    // No logs yet — use starting rotation
    return startingRotation || 'push';
  }

  const lastType = strengthLogs[0].sessionType;
  const idx = ROTATION.indexOf(lastType);
  // Advance to next non-rest
  const nextIdx = (idx + 1) % 4;
  return ROTATION[nextIdx] === 'rest' ? ROTATION[(nextIdx + 1) % 4] : ROTATION[nextIdx];
}

// Count completed sessions this week (Mon-Sun containing the given date)
function getWeekStats(workoutLogs, dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  const dow = d.getDay(); // 0=Sun
  const mondayOffset = dow === 0 ? -6 : 1 - dow;
  const monday = new Date(d);
  monday.setDate(monday.getDate() + mondayOffset);
  const sunday = new Date(monday);
  sunday.setDate(sunday.getDate() + 6);
  const monStr = monday.toISOString().slice(0, 10);
  const sunStr = sunday.toISOString().slice(0, 10);

  const weekLogs = workoutLogs.filter(l => l.completed && l.logDate >= monStr && l.logDate <= sunStr);
  return {
    strengthDays: new Set(weekLogs.filter(l => ['push', 'pull', 'legs'].includes(l.sessionType)).map(l => l.logDate)).size,
    walks: weekLogs.filter(l => l.sessionType === 'walk').length,
    intervals: weekLogs.filter(l => l.sessionType === 'interval').length,
    totalSessions: weekLogs.length,
  };
}

// Get the current program week based on how many weeks since start
function getProgramWeek(blockStartDate) {
  const start = new Date(blockStartDate + 'T00:00:00');
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  const daysSince = Math.round((now - start) / 86400000);
  return Math.min(Math.floor(daysSince / 7) + 1, 8);
}

// Get days since last strength workout
function getDaysSinceLastLift(workoutLogs, dateStr) {
  const lifts = workoutLogs
    .filter(l => l.completed && ['push', 'pull', 'legs'].includes(l.sessionType) && l.logDate < dateStr)
    .sort((a, b) => b.logDate.localeCompare(a.logDate));
  if (lifts.length === 0) return 999;
  const last = new Date(lifts[0].logDate + 'T00:00:00');
  const today = new Date(dateStr + 'T00:00:00');
  return Math.round((today - last) / 86400000);
}

// Generate smart suggestion for a day
function getSuggestion(profile, workoutLogs, dateStr) {
  const week = getProgramWeek(profile.blockStartDate);
  const ramp = getCardioRampForBlock(profile.blockNumber);
  const weekData = ramp[Math.min(week - 1, 7)];
  const weekStats = getWeekStats(workoutLogs, dateStr);
  const nextStrength = getNextStrengthType(workoutLogs, profile.startingRotation);
  const daysSinceLift = getDaysSinceLastLift(workoutLogs, dateStr);

  // Check if already logged today
  const todayLogs = workoutLogs.filter(l => l.logDate === dateStr && l.completed);
  const todayStrength = todayLogs.find(l => ['push', 'pull', 'legs'].includes(l.sessionType));
  const todayWalk = todayLogs.find(l => l.sessionType === 'walk');
  const todayInterval = todayLogs.find(l => l.sessionType === 'interval');

  const suggestions = [];
  const notes = [];

  // Strength suggestion
  if (!todayStrength) {
    if (daysSinceLift >= 3) {
      suggestions.push({ type: nextStrength, priority: 'high' });
      notes.push("It's been " + daysSinceLift + " days since your last lift — time to get back in.");
    } else if (daysSinceLift >= 1 && weekStats.strengthDays < 5) {
      // Check rotation — don't suggest legs if yesterday was legs
      const yesterdayStr = (() => { const y = new Date(dateStr + 'T12:00:00'); y.setDate(y.getDate() - 1); return y.toISOString().slice(0, 10); })();
      const didLegsYesterday = workoutLogs.some(l => l.logDate === yesterdayStr && l.sessionType === 'legs' && l.completed);
      if (nextStrength === 'legs' && didLegsYesterday) {
        // Skip to next in rotation
        suggestions.push({ type: 'rest', priority: 'normal' });
        notes.push('Rest day after legs. Good time for a walk.');
      } else {
        suggestions.push({ type: nextStrength, priority: 'normal' });
      }
    } else if (daysSinceLift === 0) {
      // Already lifted today (shouldn't reach here with todayStrength check)
    } else {
      suggestions.push({ type: 'rest', priority: 'low' });
      notes.push('Scheduled rest from lifting.');
    }
  }

  // Cardio suggestion
  const walksNeeded = weekData.walks.target - weekStats.walks;
  const intervalsNeeded = weekData.intervals.length - weekStats.intervals;

  if (!todayInterval && intervalsNeeded > 0 && (!todayStrength || todayStrength?.sessionType !== 'legs')) {
    const intervalIdx = weekStats.intervals;
    const intervalData = weekData.intervals[Math.min(intervalIdx, weekData.intervals.length - 1)];
    suggestions.push({ type: 'interval', priority: intervalsNeeded > 1 ? 'high' : 'normal', protocol: intervalData.protocol, slot: intervalData.id });
  }

  if (!todayWalk && walksNeeded > 0) {
    suggestions.push({ type: 'walk', priority: walksNeeded >= 3 ? 'high' : 'normal', duration: weekData.walks.duration });
  }

  return { suggestions, notes, week, weekData, weekStats, nextStrength, todayLogs };
}
