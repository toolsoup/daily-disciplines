  const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

  const dayPlan = useMemo(() => getPlanForDate(selectedDate, profile.blockStartDate, profile.blockNumber), [selectedDate, profile]);
  const zones = useMemo(() => computeHRZones(profile.age), [profile.age]);
  const fullPlan = useMemo(() => generateFullBlockPlan(profile.blockNumber), [profile.blockNumber]);

  // Existing data for selected date
  const dayLogs = workoutLogs.filter(l => l.logDate === selectedDate);
  const daySets = strengthSets.filter(s => s.logDate === selectedDate);
  const dayCheckin = checkins.find(c => c.checkinDate === selectedDate);

  // Most recent sets per exercise for prefill
  const lastSetsForExercise = useCallback((exerciseName) => {
    return strengthSets
      .filter(s => s.exerciseName === exerciseName && s.logDate < selectedDate)
      .sort((a, b) => b.logDate.localeCompare(a.logDate))
      .slice(0, 3);
  }, [strengthSets, selectedDate]);

  // Build prefilled sets
  const prefillSets = useCallback((exercises) => {
    const result = [];
    exercises.forEach(ex => {
      const last = lastSetsForExercise(ex.name);
      for (let s = 0; s < ex.sets; s++) {
        const existing = daySets.find(es => es.exerciseName === ex.name && es.setIndex === s);
        const prev = last.find(l => l.setIndex === s);
        result.push({
          exerciseName: ex.name,
          setIndex: s,
          weight: existing?.weight ?? prev?.weight ?? '',
          reps: existing?.reps ?? prev?.reps ?? '',
        });
      }
    });
    return result;
  }, [daySets, lastSetsForExercise]);

  if (!dayPlan) {
    // Past day 56
    const start = new Date(profile.blockStartDate + 'T00:00:00');
    const sel = new Date(selectedDate + 'T00:00:00');
    const dayIndex = Math.round((sel - start) / 86400000);
    return (
      <div style={{ maxWidth: 600, margin: '0 auto', padding: 16 }}>

          <h2 style={{ fontSize: 20, fontWeight: 700, color: '#E2E8F0', marginBottom: 8 }}>Block {profile.blockNumber} Complete!</h2>
          <p style={{ color: '#94A3B8', fontSize: 14, marginBottom: 16 }}>
            {dayIndex >= 56 ? "You've finished all 56 days. Ready for the next block?" : "This date is before your block start."}
          </p>
          {dayIndex >= 56 && (
            <button onClick={async () => {
              const newProfile = {
                ...profile,
                blockNumber: profile.blockNumber + 1,
                blockStartDate: todayStr,
                updatedAt: new Date().toISOString(),
              };
              await saveEngineProfile(user.uid, newProfile);
              onDataChange();
            }} className="btn btn-primary" style={{ padding: '12px 32px', fontSize: 16 }}>
              Start Block {profile.blockNumber + 1}
            </button>
          )}
        </div>
      </div>
    );
  }

  const strengthExercises = dayPlan.strength !== 'rest' ? STRENGTH_TEMPLATES[dayPlan.strength] : [];
  const strengthLog = dayLogs.find(l => l.sessionType === dayPlan.strength);

  // Notes state
  const [strengthNote, setStrengthNote] = useState(strengthLog?.note || '');
  const [cardioNotes, setCardioNotes] = useState({});

  const dayName = new Date(selectedDate + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });

  // Determine block day number
  const startD = new Date(profile.blockStartDate + 'T00:00:00');
  const selD = new Date(selectedDate + 'T00:00:00');
  const blockDayNum = Math.round((selD - startD) / 86400000) + 1;

  return (
    <div style={{ maxWidth: 600, margin: '0 auto', padding: isMobile ? '0 4px' : 0 }}>
      {/* Date header */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 16, flexWrap: 'wrap', gap: 8 }}>
        <div>
          <h2 style={{ fontSize: isMobile ? 18 : 22, fontWeight: 700, color: '#E2E8F0' }}>{dayName}</h2>
          <span style={{ color: '#94A3B8', fontSize: 13 }}>Block {profile.blockNumber} — Day {blockDayNum} / 56 — Week {dayPlan.week}</span>
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          <button onClick={() => {
            const d = new Date(selectedDate + 'T12:00:00');
            d.setDate(d.getDate() - 1);
            setSelectedDate(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`);
          }} className="btn btn-ghost" style={{ padding: '6px 12px' }} aria-label="Previous day">{'\u2190'}</button>
          <button onClick={() => setSelectedDate(todayStr)} className="btn btn-ghost" style={{ padding: '6px 12px', fontSize: 12 }}>Today</button>
          <button onClick={() => {
            const d = new Date(selectedDate + 'T12:00:00');
            d.setDate(d.getDate() + 1);
            setSelectedDate(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`);
          }} className="btn btn-ghost" style={{ padding: '6px 12px' }} aria-label="Next day">{'\u2192'}</button>
        </div>
      </div>

      {/* Session type badges */}
      <div style={{ display: 'flex', gap: 8, marginBottom: 16, flexWrap: 'wrap' }}>
        {dayPlan.strength !== 'rest' && (
          <span style={{ background: `${ENGINE_COLORS[dayPlan.strength]}20`, color: ENGINE_COLORS[dayPlan.strength], padding: '4px 12px', borderRadius: 20, fontSize: 12, fontWeight: 600 }}>
            {dayPlan.strength.toUpperCase()}
          </span>
        )}
        {dayPlan.cardio.map((c, i) => (
          <span key={i} style={{ background: `${ENGINE_COLORS[c.type]}20`, color: ENGINE_COLORS[c.type], padding: '4px 12px', borderRadius: 20, fontSize: 12, fontWeight: 600 }}>
            {c.type === 'walk' ? 'WALK' : `INTERVALS ${c.slot || ''}`}
          </span>
        ))}
        {dayPlan.strength === 'rest' && dayPlan.cardio.length === 0 && (
          <span style={{ background: '#37415120', color: '#94A3B8', padding: '4px 12px', borderRadius: 20, fontSize: 12, fontWeight: 600 }}>REST</span>
        )}
        {dayPlan.isBenchmark && (
          <span style={{ background: `${ENGINE_COLORS.benchmark}20`, color: ENGINE_COLORS.benchmark, padding: '4px 12px', borderRadius: 20, fontSize: 12, fontWeight: 600 }}>BENCHMARK</span>
        )}
      </div>

      {/* Strength card */}
      {strengthExercises.length > 0 && (
        <EngineStrengthCard
          sessionType={dayPlan.strength}
          exercises={strengthExercises}
          existingSets={prefillSets(strengthExercises)}
          completed={!!strengthLog?.completed}
          note={strengthNote}
          onNoteChange={setStrengthNote}
          onSaveSets={async (sets) => {
            await saveStrengthSets(user.uid, selectedDate, null, []);
            // Save each exercise's sets
            for (const ex of strengthExercises) {
              const exSets = sets.filter(s => s.exerciseName === ex.name);
              if (exSets.length > 0) {
                await saveStrengthSets(user.uid, selectedDate, ex.name, exSets);
              }
            }
            await saveWorkoutLog(user.uid, { logDate: selectedDate, sessionType: dayPlan.strength, completed: true, note: strengthNote });
            onDataChange();
          }}
          onToggleComplete={async (val) => {
            await saveWorkoutLog(user.uid, { logDate: selectedDate, sessionType: dayPlan.strength, completed: val, note: strengthNote });
            onDataChange();
          }}
        />
      )}

      {/* Cardio cards */}
      {dayPlan.cardio.map((c, i) => {
        const cardioLog = dayLogs.find(l => l.sessionType === c.type && (c.type === 'walk' || l.sessionSlot === c.slot));
        return (
          <EngineCardioCard
            key={i}
            cardioItem={c}
            zones={zones}
            completed={!!cardioLog?.completed}
            note={cardioNotes[`${c.type}_${c.slot || ''}`] || cardioLog?.note || ''}
            onNoteChange={(val) => setCardioNotes(prev => ({ ...prev, [`${c.type}_${c.slot || ''}`]: val }))}
            onToggleComplete={async (val) => {
              await saveWorkoutLog(user.uid, {
                logDate: selectedDate, sessionType: c.type,
                sessionSlot: c.slot || null, completed: val,
                note: cardioNotes[`${c.type}_${c.slot || ''}`] || '',
              });
              onDataChange();
            }}
          />
        );
      })}

      {/* Rest day message */}
      {dayPlan.strength === 'rest' && dayPlan.cardio.length === 0 && (
        <div className="dashboard-card" style={{ padding: 24, textAlign: 'center', marginBottom: 16, borderLeft: '3px solid #374151' }}>
          <div style={{ fontSize: 28, marginBottom: 8 }}>{'\uD83D\uDCA4'}</div>
          <h3 style={{ color: '#94A3B8', fontSize: 16, fontWeight: 600 }}>Rest Day</h3>
          <p style={{ color: '#94A3B8', fontSize: 13 }}>Recovery is when you grow. Stay hydrated.</p>
        </div>
      )}

      {/* Daily check-in */}
      <EngineCheckinCard
        checkin={dayCheckin}
        onSave={async (data) => {
          await saveCheckin(user.uid, { checkinDate: selectedDate, ...data });
          onDataChange();
        }}
      />

      {/* Benchmark card */}
      {dayPlan.isBenchmark && (
        <EngineBenchmarkCard
          existing={testResults.find(t => t.testDate === selectedDate)}
          blockNumber={profile.blockNumber}
          onSave={async (data) => {
            await saveTestResult(user.uid, data);
            onDataChange();
          }}
        />
      )}

      {/* HR Zones reference */}
      <div className="dashboard-card" style={{ padding: 16, marginBottom: 16 }}>
        <h4 style={{ color: '#94A3B8', fontSize: 12, fontWeight: 600, textTransform: 'uppercase', letterSpacing: 1, marginBottom: 8 }}>Heart Rate Zones</h4>
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          <span style={{ background: 'rgba(20,184,166,0.15)', color: '#14B8A6', padding: '4px 10px', borderRadius: 8, fontSize: 12 }}>Easy: {zones.easy.low}-{zones.easy.high}</span>
          <span style={{ background: 'rgba(59,130,246,0.15)', color: '#3B82F6', padding: '4px 10px', borderRadius: 8, fontSize: 12 }}>Mod: {zones.moderate.low}-{zones.moderate.high}</span>
          <span style={{ background: 'rgba(239,68,68,0.15)', color: '#EF4444', padding: '4px 10px', borderRadius: 8, fontSize: 12 }}>Hard: {zones.hard.low}+</span>
        </div>
      </div>
    </div>
  );
}

// ─── Engine Calendar View ───────────────────────────────────
function EngineCalendarView({ profile, workoutLogs, onSelectDate }) {
  const isMobile = useIsMobile();
  const fullPlan = useMemo(() => generateFullBlockPlan(profile.blockNumber), [profile.blockNumber]);
  const startDate = new Date(profile.blockStartDate + 'T00:00:00');

  const completedSet = useMemo(() => {
    const s = new Set();
    workoutLogs.filter(l => l.completed).forEach(l => {
      s.add(`${l.logDate}_${l.sessionType}${l.sessionSlot ? '_' + l.sessionSlot : ''}`);
    });
    return s;
  }, [workoutLogs]);

  const todayStr = (() => { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`; })();

  return (
    <div style={{ maxWidth: 800, margin: '0 auto' }}>
      <h2 style={{ fontSize: 20, fontWeight: 700, color: '#E2E8F0', marginBottom: 16 }}>
        Block {profile.blockNumber} — 8-Week Calendar
      </h2>

      {[1, 2, 3, 4, 5, 6, 7, 8].map(week => {
        const weekDays = fullPlan.filter(d => d.week === week);
        return (
          <div key={week} style={{ marginBottom: 12 }}>
            <div style={{ color: '#94A3B8', fontSize: 12, fontWeight: 600, marginBottom: 6, textTransform: 'uppercase', letterSpacing: 1 }}>
              Week {week}
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: `repeat(${weekDays.length}, 1fr)`, gap: isMobile ? 4 : 8 }}>
              {weekDays.map(day => {
                const date = new Date(startDate);
                date.setDate(date.getDate() + day.dayIndex);
                const dateStr = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
                const isToday = dateStr === todayStr;
                const dayLabel = date.getDate();
                const dayAbbr = ['S', 'M', 'T', 'W', 'T', 'F', 'S'][date.getDay()];

                // Collect session markers
                const markers = [];
                if (day.strength !== 'rest') {
                  const done = completedSet.has(`${dateStr}_${day.strength}`);
                  markers.push({ color: ENGINE_COLORS[day.strength], done, label: day.strength[0].toUpperCase() });
                }
                day.cardio.forEach(c => {
                  const key = `${dateStr}_${c.type}${c.slot ? '_' + c.slot : ''}`;
                  const done = completedSet.has(key);
                  markers.push({ color: ENGINE_COLORS[c.type], done, label: c.type === 'walk' ? 'W' : 'I' });
                });
                if (day.isBenchmark) {
                  markers.push({ color: ENGINE_COLORS.benchmark, done: false, label: 'B' });
                }

                return (
                  <button key={day.dayIndex} onClick={() => onSelectDate(dateStr)}
                    style={{
                      background: isToday ? 'rgba(59,130,246,0.15)' : '#1A1F35',
                      border: isToday ? '2px solid #3B82F6' : '1px solid #252B45',
                      borderRadius: 10, padding: isMobile ? '6px 2px' : '8px 4px',
                      cursor: 'pointer', textAlign: 'center', minHeight: isMobile ? 60 : 72,
                      display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'flex-start', gap: 4,
                    }}
                    aria-label={`${dayAbbr} ${dayLabel}, ${markers.map(m => m.label).join(' ')}`}
                  >
                    <div style={{ color: '#94A3B8', fontSize: 10 }}>{dayAbbr}</div>
                    <div style={{ color: '#E2E8F0', fontSize: isMobile ? 13 : 15, fontWeight: 600 }}>{dayLabel}</div>
                    <div style={{ display: 'flex', gap: 3, flexWrap: 'wrap', justifyContent: 'center' }}>
                      {markers.map((m, i) => (
                        <div key={i} style={{
                          width: isMobile ? 8 : 10, height: isMobile ? 8 : 10, borderRadius: '50%',
                          background: m.done ? m.color : 'transparent',
                          border: `2px solid ${m.color}`,
                        }} title={`${m.label}: ${m.done ? 'done' : 'planned'}`} />
                      ))}
                    </div>
                  </button>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ─── Engine Progress View ───────────────────────────────────
function EngineProgressView({ profile, workoutLogs, strengthSets, checkins, testResults }) {
  const isMobile = useIsMobile();
  const [selectedExercise, setSelectedExercise] = useState('');
  const fullPlan = useMemo(() => generateFullBlockPlan(profile.blockNumber), [profile.blockNumber]);

  // All unique exercise names
  const exerciseNames = useMemo(() => {
    const names = new Set();
    strengthSets.forEach(s => names.add(s.exerciseName));
    return [...names].sort();
  }, [strengthSets]);

  // Resting HR over time
  const rhrData = useMemo(() =>
    checkins
      .filter(c => c.restingHR)
      .map(c => ({ date: c.checkinDate, rhr: c.restingHR }))
      .sort((a, b) => a.date.localeCompare(b.date)),
  [checkins]);

  // Feel over time
  const feelData = useMemo(() =>
    checkins
      .filter(c => c.feelRating)
      .map(c => ({ date: c.checkinDate, feel: c.feelRating }))
      .sort((a, b) => a.date.localeCompare(b.date)),
  [checkins]);

  // Benchmark results
  const benchData = useMemo(() =>
    testResults
      .map(t => ({ date: t.testDate, distance: t.distance, unit: t.distanceUnit, rhr: t.restingHR, block: t.blockNumber }))
      .sort((a, b) => a.date.localeCompare(b.date)),
  [testResults]);

  // Weight progression for selected exercise
  const weightData = useMemo(() => {
    if (!selectedExercise) return [];
    const byDate = {};
    strengthSets
      .filter(s => s.exerciseName === selectedExercise)
      .forEach(s => {
        if (!byDate[s.logDate] || s.weight > byDate[s.logDate].weight) {
          byDate[s.logDate] = { date: s.logDate, weight: s.weight, reps: s.reps };
        }
      });
    return Object.values(byDate).sort((a, b) => a.date.localeCompare(b.date));
  }, [strengthSets, selectedExercise]);

  // Weekly adherence
  const adherenceData = useMemo(() => {
    const startDate = new Date(profile.blockStartDate + 'T00:00:00');
    const completedSet = new Set();
    workoutLogs.filter(l => l.completed).forEach(l => {
      completedSet.add(`${l.logDate}_${l.sessionType}${l.sessionSlot ? '_' + l.sessionSlot : ''}`);
    });

    return [1, 2, 3, 4, 5, 6, 7, 8].map(week => {
      const weekDays = fullPlan.filter(d => d.week === week);
      let planned = 0, done = 0;
      weekDays.forEach(day => {
        const date = new Date(startDate);
        date.setDate(date.getDate() + day.dayIndex);
        const dateStr = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        if (day.strength !== 'rest') {
          planned++;
          if (completedSet.has(`${dateStr}_${day.strength}`)) done++;
        }
        day.cardio.forEach(c => {
          planned++;
          const key = `${dateStr}_${c.type}${c.slot ? '_' + c.slot : ''}`;
          if (completedSet.has(key)) done++;
        });
      });
      return { week: `Wk ${week}`, pct: planned > 0 ? Math.round((done / planned) * 100) : 0, done, planned };
    });
  }, [fullPlan, workoutLogs, profile]);

  const formatDate = (d) => { const p = d.split('-'); return `${parseInt(p[1])}/${parseInt(p[2])}`; };

  return (
    <div style={{ maxWidth: 800, margin: '0 auto' }}>
      <h2 style={{ fontSize: 20, fontWeight: 700, color: '#E2E8F0', marginBottom: 20 }}>Progress</h2>

      {/* Resting Heart Rate */}
      <div className="dashboard-card" style={{ padding: isMobile ? 16 : 20, marginBottom: 20 }}>
        <h3 style={{ color: '#8B5CF6', fontSize: 14, fontWeight: 600, marginBottom: 12 }}>Resting Heart Rate</h3>
        {rhrData.length > 1 ? (
          <ResponsiveContainer width="100%" height={200}>
            <LineChart data={rhrData}>
              <CartesianGrid strokeDasharray="3 3" stroke="#252B45" />
              <XAxis dataKey="date" tick={{ fill: '#94A3B8', fontSize: 11 }} tickFormatter={formatDate} />
              <YAxis tick={{ fill: '#94A3B8', fontSize: 11 }} domain={['auto', 'auto']} />
              <Tooltip contentStyle={{ background: '#1A1F35', border: '1px solid #374151', borderRadius: 8 }} labelStyle={{ color: '#94A3B8' }} />
              <Line type="monotone" dataKey="rhr" stroke="#8B5CF6" strokeWidth={2} dot={{ fill: '#8B5CF6', r: 3 }} name="RHR (bpm)" />
            </LineChart>
          </ResponsiveContainer>
        ) : (
          <p style={{ color: '#94A3B8', fontSize: 13 }}>Log at least 2 check-ins to see your trend.</p>
        )}
      </div>

      {/* How You Feel */}
      <div className="dashboard-card" style={{ padding: isMobile ? 16 : 20, marginBottom: 20 }}>
        <h3 style={{ color: '#14B8A6', fontSize: 14, fontWeight: 600, marginBottom: 12 }}>How You Feel</h3>
        {feelData.length > 1 ? (
          <ResponsiveContainer width="100%" height={160}>
            <AreaChart data={feelData}>
              <CartesianGrid strokeDasharray="3 3" stroke="#252B45" />
              <XAxis dataKey="date" tick={{ fill: '#94A3B8', fontSize: 11 }} tickFormatter={formatDate} />
              <YAxis tick={{ fill: '#94A3B8', fontSize: 11 }} domain={[1, 5]} ticks={[1, 2, 3, 4, 5]} />
              <Tooltip contentStyle={{ background: '#1A1F35', border: '1px solid #374151', borderRadius: 8 }} />
              <Area type="monotone" dataKey="feel" stroke="#14B8A6" fill="rgba(20,184,166,0.2)" strokeWidth={2} name="Feel (1-5)" />
            </AreaChart>
          </ResponsiveContainer>
        ) : (
          <p style={{ color: '#94A3B8', fontSize: 13 }}>Log at least 2 check-ins to see your trend.</p>
        )}
      </div>

      {/* Benchmark Results */}
      <div className="dashboard-card" style={{ padding: isMobile ? 16 : 20, marginBottom: 20 }}>
        <h3 style={{ color: ENGINE_COLORS.benchmark, fontSize: 14, fontWeight: 600, marginBottom: 12 }}>Benchmark Tests</h3>
        {benchData.length > 0 ? (
          <div>
            <ResponsiveContainer width="100%" height={200}>
              <BarChart data={benchData}>
                <CartesianGrid strokeDasharray="3 3" stroke="#252B45" />
                <XAxis dataKey="date" tick={{ fill: '#94A3B8', fontSize: 11 }} tickFormatter={formatDate} />
                <YAxis tick={{ fill: '#94A3B8', fontSize: 11 }} />
                <Tooltip contentStyle={{ background: '#1A1F35', border: '1px solid #374151', borderRadius: 8 }} />
                <Bar dataKey="distance" fill={ENGINE_COLORS.benchmark} name="Distance" radius={[4, 4, 0, 0]} />
                <Bar dataKey="rhr" fill="#8B5CF6" name="RHR (bpm)" radius={[4, 4, 0, 0]} />
              </BarChart>
            </ResponsiveContainer>
          </div>
        ) : (
          <p style={{ color: '#94A3B8', fontSize: 13 }}>Complete a benchmark test to see results.</p>
        )}
      </div>

      {/* Weight Progression */}
      <div className="dashboard-card" style={{ padding: isMobile ? 16 : 20, marginBottom: 20 }}>
        <h3 style={{ color: '#3B82F6', fontSize: 14, fontWeight: 600, marginBottom: 12 }}>Weight Progression</h3>
        <select className="select" style={{ marginBottom: 12, maxWidth: 280 }} value={selectedExercise} onChange={e => setSelectedExercise(e.target.value)} aria-label="Select exercise">
          <option value="">Select an exercise...</option>
          {exerciseNames.map(n => <option key={n} value={n}>{n}</option>)}
        </select>
        {weightData.length > 1 ? (
          <ResponsiveContainer width="100%" height={200}>
            <LineChart data={weightData}>
              <CartesianGrid strokeDasharray="3 3" stroke="#252B45" />
              <XAxis dataKey="date" tick={{ fill: '#94A3B8', fontSize: 11 }} tickFormatter={formatDate} />
              <YAxis tick={{ fill: '#94A3B8', fontSize: 11 }} />
              <Tooltip contentStyle={{ background: '#1A1F35', border: '1px solid #374151', borderRadius: 8 }} />
              <Line type="monotone" dataKey="weight" stroke="#3B82F6" strokeWidth={2} dot={{ fill: '#3B82F6', r: 3 }} name="Weight (lbs)" />
            </LineChart>
          </ResponsiveContainer>
        ) : (
          <p style={{ color: '#94A3B8', fontSize: 13 }}>{selectedExercise ? 'Log at least 2 sessions to see your progression.' : 'Pick an exercise above.'}</p>
        )}
      </div>

      {/* Weekly Adherence */}
      <div className="dashboard-card" style={{ padding: isMobile ? 16 : 20, marginBottom: 20 }}>
        <h3 style={{ color: '#00B894', fontSize: 14, fontWeight: 600, marginBottom: 12 }}>Weekly Adherence</h3>
        <ResponsiveContainer width="100%" height={160}>
          <BarChart data={adherenceData}>
            <CartesianGrid strokeDasharray="3 3" stroke="#252B45" />
            <XAxis dataKey="week" tick={{ fill: '#94A3B8', fontSize: 11 }} />
            <YAxis tick={{ fill: '#94A3B8', fontSize: 11 }} domain={[0, 100]} />
            <Tooltip contentStyle={{ background: '#1A1F35', border: '1px solid #374151', borderRadius: 8 }} formatter={(v) => `${v}%`} />
            <Bar dataKey="pct" fill="#00B894" name="Adherence" radius={[4, 4, 0, 0]} />
          </BarChart>
        </ResponsiveContainer>
      </div>
    </div>
  );
}

// ─── Engine Module (Root Component) ─────────────────────────
function EngineModule({ user }) {
  const isMobile = useIsMobile();
  const [profile, setProfile] = useState(null);
  const [loading, setLoading] = useState(true);
  const [view, setView] = useState('today');
  const [selectedDate, setSelectedDate] = useState(() => {
    const t = new Date();
    return `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
  });
  const [workoutLogs, setWorkoutLogs] = useState([]);
  const [strengthSets, setStrengthSetsState] = useState([]);
  const [checkins, setCheckinsState] = useState([]);
  const [testResults, setTestResultsState] = useState([]);

  const loadAllData = useCallback(async () => {
    if (!user) return;
    setLoading(true);
    const [p, wl, ss, ci, tr] = await Promise.all([
      loadEngineProfile(user.uid),
      loadWorkoutLogs(user.uid),
      loadStrengthSets(user.uid),
      loadCheckins(user.uid),
      loadTestResults(user.uid),
    ]);
    setProfile(p);
    setWorkoutLogs(wl);
    setStrengthSetsState(ss);
    setCheckinsState(ci);
    setTestResultsState(tr);
    setLoading(false);
  }, [user]);

  useEffect(() => { loadAllData(); }, [loadAllData]);

  if (!user) {
    return (
      <div style={{ textAlign: 'center', padding: 48 }}>
        <p style={{ color: '#94A3B8', fontSize: 16 }}>Sign in to access Engine.</p>
      </div>
    );
  }

  if (loading) {
    return (
      <div style={{ textAlign: 'center', padding: 48 }}>
        <p style={{ color: '#94A3B8', fontSize: 14 }}>Loading Engine...</p>
      </div>
    );
  }

  if (!profile) {
    return (
      <EngineSetup onComplete={async (data) => {
        await saveEngineProfile(user.uid, { ...data, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
        loadAllData();
      }} />
    );
  }

  // Sub-nav for Engine views
  const views = [
    { id: 'today', label: 'Today' },
    { id: 'calendar', label: 'Calendar' },
    { id: 'progress', label: 'Progress' },
  ];

  return (
    <div>
      {/* Engine sub-nav */}
      <div style={{ display: 'flex', gap: 4, marginBottom: 20, background: '#1A1F35', borderRadius: 10, padding: 4, maxWidth: 360 }}>
        {views.map(v => (
          <button key={v.id} onClick={() => setView(v.id)}
            style={{
              flex: 1, padding: '8px 12px', borderRadius: 8, border: 'none', cursor: 'pointer',
              background: view === v.id ? '#3B82F6' : 'transparent',
              color: view === v.id ? 'white' : '#94A3B8',
              fontSize: 13, fontWeight: 600, transition: 'all 150ms',
            }}
          >
            {v.label}
          </button>
        ))}
      </div>

      {view === 'today' && (
        <EngineTodayView
          profile={profile} workoutLogs={workoutLogs} strengthSets={strengthSets}
          checkins={checkins} testResults={testResults} user={user}
          onDataChange={loadAllData}
          selectedDate={selectedDate} setSelectedDate={setSelectedDate}
        />
      )}
      {view === 'calendar' && (
        <EngineCalendarView
          profile={profile} workoutLogs={workoutLogs}
          onSelectDate={(dateStr) => { setSelectedDate(dateStr); setView('today'); }}
        />
      )}
      {view === 'progress' && (
        <EngineProgressView
          profile={profile} workoutLogs={workoutLogs} strengthSets={strengthSets}
          checkins={checkins} testResults={testResults}
        />
      )}
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────
function App() {
  const isMobile = useIsMobile();
  const now = new Date();
  const [month, setMonth] = useState(now.getMonth());
  const [year, setYear] = useState(now.getFullYear());
  const [config, setConfigState] = useState(() => loadConfig());
  const [checks, setChecksState] = useState(() => loadChecks(now.getFullYear(), now.getMonth()));
  const [metrics, setMetricsState] = useState(() => loadMetrics(now.getFullYear(), now.getMonth()));
  const [notes, setNotesState] = useState(() => loadNotes(now.getFullYear(), now.getMonth()));
  const [journal, setJournalState] = useState(() => {
    const j = loadJournal(now.getFullYear(), now.getMonth());
    // Migrate old notes as first journal entry if journal is empty
    if (j.length === 0) {
      const oldNotes = loadNotes(now.getFullYear(), now.getMonth());
      if (oldNotes && oldNotes.trim()) {
        const migrated = [{ id: uuid(), text: oldNotes.trim(), date: new Date(now.getFullYear(), now.getMonth(), 1).toISOString() }];
        saveJournal(now.getFullYear(), now.getMonth(), migrated);
        return migrated;
      }
    }
    return j;
  });
  const [goals, setGoalsState] = useState(() => loadGoals(now.getFullYear(), now.getMonth()));
  const [collapsed, setCollapsed] = useState(new Set());
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [syncStatus, setSyncStatus] = useState('idle'); // idle | syncing | synced | error
  const [activeTab, setActiveTab] = useState('habits'); // habits | engine

  const { user, loading: authLoading, signIn, signOut } = useAuth();
  const prevUserRef = useRef(null);

  const daysInMonth = useMemo(() => getDaysInMonth(month, year), [month, year]);
  const allHabits = useMemo(() => flattenHabits(config), [config]);
  const booleanHabits = useMemo(() => allHabits.filter(h => h.type !== 'number'), [allHabits]);
  // Need year/month for goal calculations in stats
  // (year and month are already in scope from useState above)

  // ── Cloud sync on auth state change ──
  useEffect(() => {
    if (authLoading) return;
    const prevUser = prevUserRef.current;
    prevUserRef.current = user;

    if (!user) {
      // Signed out: wipe local data and reset in-memory state to defaults
      clearLocalUserData();
      localStorage.removeItem('dd-last-uid');
      const freshConfig = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
      setConfigState(freshConfig);
      setChecksState({});
      setMetricsState({});
      setNotesState('');
      setJournalState([]);
      setGoalsState(defaultGoals());
      setSyncStatus('idle');
      return;
    }

    // If switching accounts on the same browser, wipe the previous user's local cache first
    const lastUid = localStorage.getItem('dd-last-uid');
    if (lastUid && lastUid !== user.uid) {
      clearLocalUserData();
    }
    localStorage.setItem('dd-last-uid', user.uid);

    // User just signed in
    (async () => {
      setSyncStatus('syncing');
      try {
        // Check if cloud data exists
        const cloudConfig = await loadConfigCloud(user.uid);
        if (!cloudConfig) {
          // First login: migrate local data to cloud
          await migrateLocalToCloud(user.uid);
        } else {
          // Returning user: pull cloud data (migrate old boolean type if needed)
          const merged = migrateConfig({ categories: cloudConfig.categories });
          setConfigState(merged);
          saveConfig(merged);

          const cloudMonth = await loadMonthCloud(user.uid, year, month);
          if (cloudMonth) {
            if (cloudMonth.checks) { setChecksState(cloudMonth.checks); saveChecks(year, month, cloudMonth.checks); }
            if (cloudMonth.metrics) { setMetricsState(cloudMonth.metrics); saveMetrics(year, month, cloudMonth.metrics); }
            if (cloudMonth.notes !== undefined) { setNotesState(cloudMonth.notes); saveNotes(year, month, cloudMonth.notes); }
            if (cloudMonth.journal) { setJournalState(cloudMonth.journal); saveJournal(year, month, cloudMonth.journal); }
            if (cloudMonth.goals) { setGoalsState(cloudMonth.goals); saveGoals(year, month, cloudMonth.goals); }
          }
        }
        setSyncStatus('synced');
      } catch (err) {
        console.error('Cloud sync error:', err);
        setSyncStatus('error');
      }
    })();
  }, [user, authLoading]);

  // Persist config (local + cloud)
  const setConfig = useCallback((c) => {
    setConfigState(c);
    saveConfigCloud(c, user?.uid);
    if (user) setSyncStatus('synced');
  }, [user]);

  // Load data when month/year changes
  useEffect(() => {
    setChecksState(loadChecks(year, month));
    setMetricsState(loadMetrics(year, month));
    setNotesState(loadNotes(year, month));
    setGoalsState(loadGoals(year, month));
    const j = loadJournal(year, month);
    if (j.length === 0) {
      const oldNotes = loadNotes(year, month);
      if (oldNotes && oldNotes.trim()) {
        const migrated = [{ id: uuid(), text: oldNotes.trim(), date: new Date(year, month, 1).toISOString() }];
        saveJournal(year, month, migrated);
        setJournalState(migrated);
      } else {
        setJournalState([]);
      }
    } else {
      setJournalState(j);
    }

    // Also fetch from cloud in background
    if (user) {
      (async () => {
        setSyncStatus('syncing');
        try {
          const cloudMonth = await loadMonthCloud(user.uid, year, month);
          if (cloudMonth) {
            if (cloudMonth.checks) { setChecksState(cloudMonth.checks); saveChecks(year, month, cloudMonth.checks); }
            if (cloudMonth.metrics) { setMetricsState(cloudMonth.metrics); saveMetrics(year, month, cloudMonth.metrics); }
            if (cloudMonth.notes !== undefined) { setNotesState(cloudMonth.notes); saveNotes(year, month, cloudMonth.notes); }
            if (cloudMonth.journal) { setJournalState(cloudMonth.journal); saveJournal(year, month, cloudMonth.journal); }
            if (cloudMonth.goals) { setGoalsState(cloudMonth.goals); saveGoals(year, month, cloudMonth.goals); }
          }
          setSyncStatus('synced');
        } catch (err) {
          console.error('Cloud load error:', err);
          setSyncStatus('error');
        }
      })();
    }
  }, [month, year]);

  // Debounced cloud save helper
  const cloudSaveTimeout = useRef(null);
  const scheduleCloudSave = useCallback((checksVal, metricsVal, notesVal, journalVal, goalsVal) => {
    if (!user) return;
    clearTimeout(cloudSaveTimeout.current);
    cloudSaveTimeout.current = setTimeout(() => {
      saveMonthCloud(year, month, checksVal, metricsVal, notesVal, user.uid, journalVal, goalsVal);
      setSyncStatus('synced');
    }, 1000);
    setSyncStatus('syncing');
  }, [user, year, month]);

  // Persist checks (local immediately, cloud debounced)
  const setChecks = useCallback((updater) => {
    setChecksState(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      saveChecks(year, month, next);
      // Read current metrics/notes for cloud save
      scheduleCloudSave(next, loadMetrics(year, month), loadNotes(year, month));
      return next;
    });
  }, [year, month, scheduleCloudSave]);

  // Persist metrics (local immediately, cloud debounced)
  const setMetrics = useCallback((updater) => {
    setMetricsState(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      saveMetrics(year, month, next);
      scheduleCloudSave(loadChecks(year, month), next, loadNotes(year, month));
      return next;
    });
  }, [year, month, scheduleCloudSave]);

  // Persist notes (local immediately, cloud debounced)
  const setNotes = useCallback((val) => {
    setNotesState(val);
    saveNotes(year, month, val);
    scheduleCloudSave(loadChecks(year, month), loadMetrics(year, month), val);
  }, [year, month, scheduleCloudSave]);

  // Persist journal (local immediately, cloud debounced)
  const setJournal = useCallback((updater) => {
    setJournalState(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      saveJournal(year, month, next);
      scheduleCloudSave(loadChecks(year, month), loadMetrics(year, month), loadNotes(year, month), next, loadGoals(year, month));
      return next;
    });
  }, [year, month, scheduleCloudSave]);

  // Persist goals (local immediately, cloud debounced)
  const setGoals = useCallback((updater) => {
    setGoalsState(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      saveGoals(year, month, next);
      scheduleCloudSave(loadChecks(year, month), loadMetrics(year, month), loadNotes(year, month), loadJournal(year, month), next);
      return next;
    });
  }, [year, month, scheduleCloudSave]);

  const toggleCheck = useCallback((key) => {
    setChecks(prev => ({ ...prev, [key]: !prev[key] }));
  }, [setChecks]);

  const setMetric = useCallback((key, value) => {
    setMetrics(prev => {
      const next = { ...prev };
      if (value === undefined) { delete next[key]; } else { next[key] = value; }
      return next;
    });
  }, [setMetrics]);

  const toggleCollapse = useCallback((catId) => {
    setCollapsed(prev => {
      const next = new Set(prev);
      if (next.has(catId)) next.delete(catId); else next.add(catId);
      return next;
    });
  }, []);

  // ── Per-habit stats ──
  const habitStats = useMemo(() => {
    const stats = {};
    allHabits.forEach(h => {
      if (h.type === 'number') {
        let sum = 0; let entries = 0; let streak = 0; let maxStreak = 0;
        for (let d = 1; d <= daysInMonth; d++) {
          const val = metrics[cellKey(h.id, d)];
          if (val !== undefined && val !== '') {
            const num = typeof val === 'number' ? val : parseFloat(val);
            if (!isNaN(num)) { sum += num; entries++; streak++; if (streak > maxStreak) maxStreak = streak; }
            else { streak = 0; }
          } else { streak = 0; }
        }
        const goal = h.goal;
        const pct = goal ? Math.round((sum / goal) * 100) : (entries > 0 ? 100 : 0);
        stats[h.id] = { done: entries, pct: Math.min(pct, 100), remaining: goal ? Math.max(0, goal - sum) : 0, streak: maxStreak, sum, avg: entries > 0 ? sum / entries : 0, entries };
      } else {
        // Check-based habits: daily, specific_days, per_week, per_month
        let done = 0; let streak = 0; let maxStreak = 0;
        for (let d = 1; d <= daysInMonth; d++) {
          const checked = !!checks[cellKey(h.id, d)];
          if (h.type === 'specific_days') {
            // Only count checks on active days toward progress
            const isActive = isDayActiveForHabit(h, year, month, d);
            if (isActive && checked) { done++; streak++; if (streak > maxStreak) maxStreak = streak; }
            else if (isActive) { streak = 0; }
            // Non-active day checks don't break streak or count toward goal
          } else {
            if (checked) { done++; streak++; if (streak > maxStreak) maxStreak = streak; }
            else { streak = 0; }
          }
        }
        const goal = habitGoalForMonth(h, year, month);
        const pct = goal > 0 ? Math.round((done / goal) * 100) : 0;
        stats[h.id] = { done, pct: Math.min(pct, 100), remaining: Math.max(0, goal - done), streak: maxStreak, goal };
      }
    });
    return stats;
  }, [allHabits, checks, metrics, daysInMonth, year, month]);

  // ── Daily stats (check-based habits) ──
  const dailyData = useMemo(() => {
    const data = [];
    for (let d = 1; d <= daysInMonth; d++) {
      let count = 0, total = 0;
      booleanHabits.forEach(h => {
        if (h.type === 'specific_days' && !(h.activeDays || []).includes(getDayOfWeek(year, month, d))) return;
        total++;
        if (checks[cellKey(h.id, d)]) count++;
      });
      data.push({ day: d, pct: total > 0 ? Math.round((count / total) * 100) : 0, count });
    }
    return data;
  }, [booleanHabits, checks, daysInMonth, year, month]);

  // ── Global stats ──
  const { totalDone, totalPossible, overallPct, bestStreak, todayScore, todayTotal } = useMemo(() => {
    let totalDone = 0, totalPossible = 0;
    let bestStreak = { habit: '', count: 0 };

    booleanHabits.forEach(h => {
      const s = habitStats[h.id];
      if (s) {
        totalDone += s.done;
        totalPossible += (s.goal || habitGoalForMonth(h, year, month));
        if (s.streak > bestStreak.count) bestStreak = { habit: h.name, count: s.streak };
      }
    });

    const today = now.getDate();
    let todayScore = 0, todayTotal = 0;
    booleanHabits.forEach(h => {
      if (h.type === 'specific_days' && !(h.activeDays || []).includes(getDayOfWeek(year, month, today))) return;
      todayTotal++;
      if (checks[cellKey(h.id, today)]) todayScore++;
    });

    return {
      totalDone, totalPossible,
      overallPct: totalPossible > 0 ? Math.round((totalDone / totalPossible) * 100) : 0,
      bestStreak, todayScore, todayTotal,
    };
  }, [booleanHabits, habitStats, checks, daysInMonth, year, month]);

  // ── Weekly summaries ──
  const weeklyData = useMemo(() => {
    const weeks = [];
    let weekNum = 1;
    for (let start = 1; start <= daysInMonth; start += 7) {
      const end = Math.min(start + 6, daysInMonth);
      let done = 0, possible = 0;
      for (let d = start; d <= end; d++) {
        booleanHabits.forEach(h => {
          if (h.type === 'specific_days' && !(h.activeDays || []).includes(getDayOfWeek(year, month, d))) return;
          possible++;
          if (checks[cellKey(h.id, d)]) done++;
        });
      }
      weeks.push({ week: `Wk ${weekNum}`, pct: possible > 0 ? Math.round((done / possible) * 100) : 0, days: `${start}-${end}` });
      weekNum++;
    }
    return weeks;
  }, [booleanHabits, checks, daysInMonth, year, month]);

  return (
    <div style={{ maxWidth: 1400, margin: '0 auto', padding: isMobile ? '8px 6px' : '24px 16px' }}>
      <Header month={month} year={year} setMonth={setMonth} setYear={setYear} overallPct={overallPct} onOpenSettings={() => setSettingsOpen(true)} user={user} onSignIn={signIn} syncStatus={syncStatus} activeTab={activeTab} />

      {/* Tab bar */}
      <div style={{ display: 'flex', gap: 0, marginBottom: isMobile ? 12 : 20, background: '#1A1F35', borderRadius: 12, padding: 4, maxWidth: 280 }}>
        <button onClick={() => setActiveTab('habits')}
          style={{ flex: 1, padding: '10px 20px', borderRadius: 10, border: 'none', cursor: 'pointer', background: activeTab === 'habits' ? '#3B82F6' : 'transparent', color: activeTab === 'habits' ? 'white' : '#94A3B8', fontSize: 14, fontWeight: 700, letterSpacing: 1, transition: 'all 150ms' }}>
          HABITS
        </button>
        <button onClick={() => setActiveTab('engine')}
          style={{ flex: 1, padding: '10px 20px', borderRadius: 10, border: 'none', cursor: 'pointer', background: activeTab === 'engine' ? '#3B82F6' : 'transparent', color: activeTab === 'engine' ? 'white' : '#94A3B8', fontSize: 14, fontWeight: 700, letterSpacing: 1, transition: 'all 150ms' }}>
          ENGINE
        </button>
      </div>

      {activeTab === 'habits' && (
        <>
          <DashboardCards totalDone={totalDone} totalPossible={totalPossible} bestStreak={bestStreak} todayScore={todayScore} todayTotal={todayTotal} />
          <DailyChart dailyData={dailyData} />
          <HabitGrid config={config} checks={checks} metrics={metrics} toggleCheck={toggleCheck} setMetric={setMetric} collapsed={collapsed} toggleCollapse={toggleCollapse} daysInMonth={daysInMonth} habitStats={habitStats} month={month} year={year} />
          <GoalsPanel goals={goals} setGoals={setGoals} />
          <MetricsDashboard config={config} metrics={metrics} />
          <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : 'repeat(auto-fit, minmax(400px, 1fr))', gap: isMobile ? 12 : 24 }}>
            <WeeklySummary weeklyData={weeklyData} />
            <Journal journal={journal} setJournal={setJournal} />
          </div>
          <Leaderboard config={config} habitStats={habitStats} />
        </>
      )}

      {activeTab === 'engine' && (
        <EngineModule user={user} />
      )}

      <SettingsPanel isOpen={settingsOpen} onClose={() => setSettingsOpen(false)} config={config} setConfig={setConfig} user={user} onSignOut={signOut} />
      <div style={{ textAlign: 'center', padding: '24px 0', color: '#94A3B8', fontSize: 12 }}>
        Daily Disciplines v2 — Built for consistency, not perfection.
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
