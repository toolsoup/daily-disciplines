// ─── Strength Card ──────────────────────────────────────────
function FPStrengthCard({ sessionType, exercises, existingSets, onSaveSets, completed, note, onNoteChange }) {
  const isMobile = useIsMobile();

  // Local exercise list (editable names, add/remove)
  const [localExercises, setLocalExercises] = useState(() =>
    exercises.map(ex => ({ ...ex, displayName: ex.name }))
  );

  // Local sets with failure flag
  const [localSets, setLocalSets] = useState(() => {
    const init = {};
    exercises.forEach(ex => {
      init[ex.name] = [];
      for (let s = 0; s < ex.sets; s++) {
        const existing = existingSets.find(es => es.exerciseName === ex.name && es.setIndex === s);
        init[ex.name].push({ setIndex: s, weight: existing ? existing.weight : '', reps: existing ? existing.reps : '', failure: existing?.failure || false });
      }
    });
    return init;
  });

  const [editingName, setEditingName] = useState(null); // key of exercise being renamed
  const [showAddExercise, setShowAddExercise] = useState(false);
  const [newExName, setNewExName] = useState('');

  const updateSet = (exKey, setIdx, field, value) => {
    setLocalSets(prev => {
      const next = { ...prev };
      next[exKey] = [...next[exKey]];
      next[exKey][setIdx] = { ...next[exKey][setIdx], [field]: value };
      return next;
    });
  };

  const addSet = (exKey) => {
    setLocalSets(prev => {
      const next = { ...prev };
      const sets = [...(next[exKey] || [])];
      sets.push({ setIndex: sets.length, weight: '', reps: '', failure: false });
      next[exKey] = sets;
      return next;
    });
  };

  const removeExercise = (exKey) => {
    setLocalExercises(prev => prev.filter(e => e.name !== exKey));
    setLocalSets(prev => {
      const next = { ...prev };
      delete next[exKey];
      return next;
    });
  };

  const renameExercise = (oldKey, newName) => {
    if (!newName.trim() || newName === oldKey) { setEditingName(null); return; }
    setLocalExercises(prev => prev.map(e => e.name === oldKey ? { ...e, name: newName.trim(), displayName: newName.trim() } : e));
    setLocalSets(prev => {
      const next = { ...prev };
      next[newName.trim()] = next[oldKey] || [];
      delete next[oldKey];
      return next;
    });
    setEditingName(null);
  };

  const addExercise = () => {
    if (!newExName.trim()) return;
    const name = newExName.trim();
    setLocalExercises(prev => [...prev, { name, displayName: name, sets: 3, repsRange: '10-12' }]);
    setLocalSets(prev => ({
      ...prev,
      [name]: [
        { setIndex: 0, weight: '', reps: '', failure: false },
        { setIndex: 1, weight: '', reps: '', failure: false },
        { setIndex: 2, weight: '', reps: '', failure: false },
      ],
    }));
    setNewExName('');
    setShowAddExercise(false);
  };

  const handleSave = () => {
    const allSets = [];
    localExercises.forEach(ex => {
      (localSets[ex.name] || []).forEach(s => {
        if (s.weight || s.reps) allSets.push({
          exerciseName: ex.name, setIndex: s.setIndex,
          weight: parseFloat(s.weight) || 0, reps: parseInt(s.reps) || 0, failure: !!s.failure,
        });
      });
    });
    onSaveSets(allSets, localExercises);
  };

  const color = FP_COLORS[sessionType];

  return (
    <div className="dashboard-card" style={{ padding: isMobile ? 16 : 20, marginBottom: 16, borderLeft: `3px solid ${color}` }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
        <h3 style={{ fontSize: 16, fontWeight: 700, color }}>{FP_FULL_LABELS[sessionType]}</h3>
        {completed && <span style={{ color: '#00B894', fontSize: 20, fontWeight: 700 }}>{'\u2713'}</span>}
      </div>

      {localExercises.map(ex => (
        <div key={ex.name} style={{ marginBottom: 14, background: '#1A1F3540', borderRadius: 10, padding: isMobile ? '10px 8px' : '10px 12px' }}>
          {/* Exercise name — editable */}
          <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 6, flexWrap: 'wrap' }}>
            {editingName === ex.name ? (
              <input className="input" autoFocus style={{ fontSize: 13, fontWeight: 600, padding: '4px 8px', maxWidth: 240 }}
                defaultValue={ex.name}
                onBlur={e => renameExercise(ex.name, e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter') renameExercise(ex.name, e.target.value); }}
                aria-label="Rename exercise" />
            ) : (
              <span onClick={() => setEditingName(ex.name)} style={{ color: '#E2E8F0', fontSize: 13, fontWeight: 600, cursor: 'pointer', borderBottom: '1px dashed #374151' }}
                title="Click to rename">
                {ex.displayName || ex.name}
              </span>
            )}
            <span style={{ color: '#94A3B8', fontWeight: 400, fontSize: 12 }}>{ex.repsRange ? `${(localSets[ex.name] || []).length}x${ex.repsRange}` : ''}</span>
            <button onClick={() => removeExercise(ex.name)} title="Remove exercise"
              style={{ marginLeft: 'auto', background: 'none', border: 'none', color: '#EF444480', cursor: 'pointer', fontSize: 14, padding: '2px 6px' }}>
              {'\u2715'}
            </button>
          </div>

          {/* Sets */}
          <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', alignItems: 'center' }}>
            {(localSets[ex.name] || []).map((s, idx) => (
              <div key={idx} style={{ display: 'flex', alignItems: 'center', gap: 3, background: '#1A1F35', borderRadius: 8, padding: '4px 6px' }}>
                <span style={{ color: '#94A3B8', fontSize: 10, minWidth: 14 }}>S{idx + 1}</span>
                <input type="number" inputMode="decimal" placeholder="lbs"
                  style={{ width: 50, height: 36, background: '#252B45', color: '#E2E8F0', border: '1px solid #374151', borderRadius: 6, textAlign: 'center', fontSize: 14, outline: 'none', padding: 0 }}
                  value={s.weight} onChange={e => updateSet(ex.name, idx, 'weight', e.target.value)} aria-label={`${ex.name} set ${idx + 1} weight`} />
                <span style={{ color: '#94A3B8', fontSize: 10 }}>x</span>
                <input type="number" inputMode="numeric" placeholder="reps"
                  style={{ width: 42, height: 36, background: '#252B45', color: '#E2E8F0', border: '1px solid #374151', borderRadius: 6, textAlign: 'center', fontSize: 14, outline: 'none', padding: 0 }}
                  value={s.reps} onChange={e => updateSet(ex.name, idx, 'reps', e.target.value)} aria-label={`${ex.name} set ${idx + 1} reps`} />
                <button onClick={() => updateSet(ex.name, idx, 'failure', !s.failure)} title={s.failure ? 'Pushed to failure' : 'Mark failure'}
                  style={{
                    width: 28, height: 28, borderRadius: 6, border: s.failure ? '2px solid #EF4444' : '1px solid #374151',
                    background: s.failure ? 'rgba(239,68,68,0.2)' : '#252B45', color: s.failure ? '#EF4444' : '#374151',
                    cursor: 'pointer', fontSize: 11, fontWeight: 800, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 0,
                  }}
                  aria-label={`${ex.name} set ${idx + 1} failure toggle`}>
                  F
                </button>
              </div>
            ))}
            <button onClick={() => addSet(ex.name)} title="Add set"
              style={{ width: 32, height: 32, borderRadius: 8, border: '1px dashed #374151', background: 'transparent', color: '#94A3B8', cursor: 'pointer', fontSize: 16, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              +
            </button>
          </div>
        </div>
      ))}

      {/* Add exercise */}
      {showAddExercise ? (
        <div style={{ display: 'flex', gap: 8, marginBottom: 12, alignItems: 'center' }}>
          <input className="input" style={{ fontSize: 13, padding: '6px 10px', flex: 1 }} placeholder="Exercise name"
            value={newExName} onChange={e => setNewExName(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') addExercise(); }}
            autoFocus aria-label="New exercise name" />
          <button onClick={addExercise} className="btn btn-primary" style={{ padding: '6px 14px', fontSize: 12 }}>Add</button>
          <button onClick={() => { setShowAddExercise(false); setNewExName(''); }} className="btn btn-ghost" style={{ padding: '6px 10px', fontSize: 12 }}>Cancel</button>
        </div>
      ) : (
        <button onClick={() => setShowAddExercise(true)}
          style={{ background: 'none', border: '1px dashed #374151', borderRadius: 8, padding: '8px 16px', color: '#94A3B8', cursor: 'pointer', fontSize: 12, width: '100%', marginBottom: 12 }}>
          + Add Exercise
        </button>
      )}

      <textarea className="input" style={{ minHeight: 40, resize: 'vertical', fontSize: 13, marginBottom: 12 }}
        placeholder="Session notes (optional)" value={note || ''} onChange={e => onNoteChange(e.target.value)} aria-label="Session notes" />

      <button onClick={handleSave} className="btn btn-primary" style={{ width: '100%', padding: '10px 16px' }}>
        {completed ? 'Update Session' : 'Complete Session'}
      </button>
    </div>
  );
}

// ─── Cardio Card ────────────────────────────────────────────

            {'\u2715'}

      </div>

          title="Click to edit">

        </span>

      <textarea className="input" style={{ minHeight: 36, resize: 'vertical', fontSize: 13, marginBottom: 12 }}
        placeholder="Notes (optional)" value={note || ''} onChange={e => onNoteChange(e.target.value)} aria-label="Cardio notes" />
      <button onClick={() => onToggleComplete(!completed)} className="btn"
        style={{ width: '100%', padding: '10px 16px', background: completed ? '#252B45' : color, color: 'white', border: completed ? '1px solid #374151' : 'none' }}>
        {completed ? 'Mark Incomplete' : 'Complete'}
      </button>
    </div>
  );
}

// ─── Today View (Adaptive) ──────────────────────────────────
function FPTodayView({ profile, workoutLogs, strengthSets, checkins, testResults, user, onDataChange, selectedDate, setSelectedDate }) {
  const isMobile = useIsMobile();
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
  const zones = useMemo(() => computeHRZones(profile.age), [profile.age]);

  // Adaptive suggestion
  const suggestion = useMemo(() => getSuggestion(profile, workoutLogs, selectedDate), [profile, workoutLogs, selectedDate]);

  // Manual override: let user pick a different session
  const [manualStrength, setManualStrength] = useState(null);
  const [showPicker, setShowPicker] = useState(false);

  // Reset manual override when date changes
  useEffect(() => { setManualStrength(null); setShowPicker(false); }, [selectedDate]);

  // Existing data for selected date
  const dayLogs = workoutLogs.filter(l => l.logDate === selectedDate);
  const daySets = strengthSets.filter(s => s.logDate === selectedDate);
  const dayCheckin = checkins.find(c => c.checkinDate === selectedDate);

  // Did a strength session already get logged on this date?
  const loggedStrengthSession = dayLogs.find(l => ['push', 'pull', 'legs'].includes(l.sessionType) && l.completed);

  // What strength type to show: logged session > manual override > suggestion
  const activeStrength = loggedStrengthSession?.sessionType || manualStrength || (suggestion.suggestions.find(s => ['push', 'pull', 'legs'].includes(s.type))?.type);
  const isCompleted = !!loggedStrengthSession?.completed;

  // Build exercise list: if we have logged sets for this date, reconstruct from actual data; otherwise use template
  const exercisesForCard = useMemo(() => {
    if (daySets.length > 0 && activeStrength) {
      // Completed session exists — show ONLY what was actually saved, not the template
      const exMap = {};
      daySets.forEach(s => {
        if (!exMap[s.exerciseName]) exMap[s.exerciseName] = { name: s.exerciseName, sets: 0, repsRange: '' };
        exMap[s.exerciseName].sets = Math.max(exMap[s.exerciseName].sets, s.setIndex + 1);
      });
      // Preserve order: if a template exercise is in the saved data, use template's repsRange hint
      const template = STRENGTH_TEMPLATES[activeStrength] || [];
      const templateMap = {};
      template.forEach(e => { templateMap[e.name] = e; });
      return Object.values(exMap).map(e => ({
        ...e,
        repsRange: templateMap[e.name]?.repsRange || e.repsRange,
      }));
    }
    return activeStrength && STRENGTH_TEMPLATES[activeStrength] ? STRENGTH_TEMPLATES[activeStrength] : [];
  }, [daySets, activeStrength]);

  // Prefill sets from saved data for this date + fallback to previous sessions
  const prefillSets = useCallback((exercises) => {
    return exercises.flatMap(ex => {
      const past = strengthSets
        .filter(s => s.exerciseName === ex.name && s.logDate < selectedDate)
        .sort((a, b) => b.logDate.localeCompare(a.logDate));
      const result = [];
      for (let s = 0; s < ex.sets; s++) {
        const existing = daySets.find(es => es.exerciseName === ex.name && es.setIndex === s);
        const prev = past.find(p => p.setIndex === s);
        result.push({
          exerciseName: ex.name, setIndex: s,
          weight: existing?.weight ?? prev?.weight ?? '',
          reps: existing?.reps ?? prev?.reps ?? '',
          failure: existing?.failure || false,
        });
      }
      return result;
    });
  }, [daySets, strengthSets, selectedDate]);

  const dayName = new Date(selectedDate + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
  const programWeek = getProgramWeek(profile.blockStartDate);
  const ramp = getCardioRampForBlock(profile.blockNumber);
  const weekData = ramp[Math.min(programWeek - 1, 7)];

  // Check benchmark week
  const isBenchmarkWeek = weekData.benchmark;

  // Strength notes — prefer the logged session's note
  const strengthLog = loggedStrengthSession || dayLogs.find(l => l.sessionType === activeStrength);
  const [strengthNote, setStrengthNote] = useState(strengthLog?.note || '');
  const [cardioNotes, setCardioNotes] = useState({});

  return (
    <div style={{ maxWidth: 600, margin: '0 auto', padding: isMobile ? '0 4px' : 0 }}>
      {/* Date nav */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12, flexWrap: 'wrap', gap: 8 }}>
        <div>
          <h2 style={{ fontSize: isMobile ? 18 : 22, fontWeight: 700, color: '#E2E8F0' }}>{dayName}</h2>
          <span style={{ color: '#94A3B8', fontSize: 13 }}>Block {profile.blockNumber} — Week {programWeek}</span>
        </div>
        <div style={{ display: 'flex', gap: 6 }}>
          <button onClick={() => { const d = new Date(selectedDate + 'T12:00:00'); d.setDate(d.getDate() - 1); setSelectedDate(d.toISOString().slice(0, 10)); }}
            className="btn btn-ghost" style={{ padding: '6px 12px' }} aria-label="Previous day">{'\u2190'}</button>
          <button onClick={() => setSelectedDate(todayStr)} className="btn btn-ghost" style={{ padding: '6px 12px', fontSize: 12 }}>Today</button>
          <button onClick={() => { const d = new Date(selectedDate + 'T12:00:00'); d.setDate(d.getDate() + 1); setSelectedDate(d.toISOString().slice(0, 10)); }}
            className="btn btn-ghost" style={{ padding: '6px 12px' }} aria-label="Next day">{'\u2192'}</button>
        </div>
      </div>

      {/* Smart suggestion banner */}
      {suggestion.notes.length > 0 && (
        <div style={{ background: '#252B45', borderRadius: 10, padding: '10px 14px', marginBottom: 12, borderLeft: '3px solid #F59E0B' }}>
          {suggestion.notes.map((n, i) => <p key={i} style={{ color: '#F59E0B', fontSize: 13 }}>{n}</p>)}
        </div>
      )}

      {/* Week progress bar */}
      <div style={{ background: '#1A1F35', borderRadius: 10, padding: 12, marginBottom: 16 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}>
          <span style={{ color: '#94A3B8', fontSize: 12, fontWeight: 600 }}>This Week</span>
          <span style={{ color: '#94A3B8', fontSize: 12 }}>
            {suggestion.weekStats.strengthDays} lifts · {suggestion.weekStats.walks} walks · {suggestion.weekStats.intervals} intervals
          </span>
        </div>
        <div style={{ display: 'flex', gap: 6, fontSize: 12 }}>
          <span style={{ color: '#14B8A6' }}>Walks: {suggestion.weekStats.walks}/{suggestion.weekData.walks.target}</span>
          <span style={{ color: '#94A3B8' }}>·</span>
          <span style={{ color: '#EF4444' }}>Intervals: {suggestion.weekStats.intervals}/{suggestion.weekData.intervals.length}</span>
        </div>
      </div>

      {/* Session picker — choose what to do today */}
      <div style={{ marginBottom: 16 }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 8 }}>
          <span style={{ color: '#94A3B8', fontSize: 12, fontWeight: 600, textTransform: 'uppercase', letterSpacing: 1 }}>Today's Session</span>
          <button onClick={() => setShowPicker(!showPicker)} className="btn btn-ghost" style={{ padding: '4px 10px', fontSize: 11 }}>
            {showPicker ? 'Close' : 'Change'}
          </button>
        </div>

        {showPicker && (
          <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 12, background: '#1A1F35', padding: 10, borderRadius: 10 }}>
            {['push', 'pull', 'legs'].map(t => (
              <button key={t} onClick={() => { setManualStrength(t); setShowPicker(false); }}
                style={{ padding: '8px 16px', borderRadius: 8, border: `1px solid ${FP_COLORS[t]}40`, background: activeStrength === t ? `${FP_COLORS[t]}20` : 'transparent',
                  color: FP_COLORS[t], cursor: 'pointer', fontSize: 13, fontWeight: 600, textTransform: 'capitalize' }}>
                {t}
              </button>
            ))}
            <button onClick={() => { setManualStrength('skip'); setShowPicker(false); }}
              style={{ padding: '8px 16px', borderRadius: 8, border: '1px solid #37415180', background: 'transparent', color: '#94A3B8', cursor: 'pointer', fontSize: 13, fontWeight: 600 }}>
              Skip Lifting
            </button>
            <button onClick={() => { setManualStrength('rest'); setShowPicker(false); }}
              style={{ padding: '8px 16px', borderRadius: 8, border: '1px solid #37415180', background: 'transparent', color: '#94A3B8', cursor: 'pointer', fontSize: 13, fontWeight: 600 }}>
              Full Rest Day
            </button>
          </div>
        )}
      </div>

      {/* Strength card */}
      {activeStrength && activeStrength !== 'rest' && activeStrength !== 'skip' && exercisesForCard.length > 0 && (
        <FPStrengthCard
          key={selectedDate + '_' + activeStrength}
          sessionType={activeStrength}
          exercises={exercisesForCard}
          existingSets={prefillSets(exercisesForCard)}
          completed={isCompleted}
          note={strengthNote}
          onNoteChange={setStrengthNote}
          onSaveSets={async (sets, localExercises) => {
            const exNames = new Set((localExercises || []).map(e => e.name));
            sets.forEach(s => exNames.add(s.exerciseName));
            for (const name of exNames) {
              const exSets = sets.filter(s => s.exerciseName === name);
              if (exSets.length > 0) await saveStrengthSets(user.uid, selectedDate, name, exSets);
            }
            await saveWorkoutLog(user.uid, { logDate: selectedDate, sessionType: activeStrength, completed: true, note: strengthNote });
            onDataChange();
          }}
        />
      )}

      {/* Skip / Rest message */}
      {(activeStrength === 'rest' || (manualStrength === 'rest')) && (
        <div className="dashboard-card" style={{ padding: 20, textAlign: 'center', marginBottom: 16, borderLeft: '3px solid #374151' }}>
          <h3 style={{ color: '#94A3B8', fontSize: 16, fontWeight: 600 }}>Rest Day</h3>
          <p style={{ color: '#94A3B8', fontSize: 13 }}>Recovery is when you grow. A walk still counts!</p>
        </div>
      )}
      {activeStrength === 'skip' && (
        <div className="dashboard-card" style={{ padding: 20, textAlign: 'center', marginBottom: 16, borderLeft: '3px solid #374151' }}>
          <h3 style={{ color: '#94A3B8', fontSize: 16, fontWeight: 600 }}>Skipping Lifting Today</h3>
          <p style={{ color: '#94A3B8', fontSize: 13 }}>No worries — pick up the rotation next session. Consider cardio below.</p>
        </div>
      )}

      {/* Cardio cards — show logged sessions first, then suggestions */}
      {manualStrength !== 'rest' && (() => {
        // Logged cardio for this date
        const loggedCardio = dayLogs.filter(l => (l.sessionType === 'walk' || l.sessionType === 'interval'));
        // Suggestion-based cardio (only for sessions not already logged)
        const cardioSuggestions = suggestion.suggestions.filter(s =>
          (s.type === 'interval' || s.type === 'walk') &&
          !loggedCardio.some(lc => lc.sessionType === s.type && (s.type === 'walk' || lc.sessionSlot === s.slot))
        );
        // Merge: logged first, then new suggestions
        const allCardio = [
          ...loggedCardio.map(lc => ({ type: lc.sessionType, slot: lc.sessionSlot, protocol: lc.sessionType === 'interval' ? (lc.note || 'Intervals') : null, duration: lc.sessionType === 'walk' ? weekData.walks.duration : null, logged: true, log: lc })),
          ...cardioSuggestions.map(cs => ({ ...cs, logged: false })),
        ];

        if (allCardio.length === 0 && suggestion.weekStats.walks >= weekData.walks.target && suggestion.weekStats.intervals >= weekData.intervals.length) {
          return <div style={{ color: '#94A3B8', fontSize: 13, marginBottom: 16, padding: '8px 12px', background: '#1A1F35', borderRadius: 8 }}>Cardio targets met for this week!</div>;
        }
        return allCardio.map((cs, i) => {
          const cardioLog = cs.logged ? cs.log : dayLogs.find(l => l.sessionType === cs.type && l.completed);
          return (
            <FPCardioCard key={`${cs.type}_${cs.slot || ''}_${i}`} cardioType={cs.type}
              protocol={cs.protocol || (cs.type === 'interval' ? weekData.intervals[0]?.protocol : null)}
              duration={cs.duration || weekData.walks.duration}
              slot={cs.slot} zones={zones}
              completed={!!cardioLog?.completed}
              note={cardioNotes[`${cs.type}_${cs.slot || ''}`] ?? cardioLog?.note ?? ''}
              onNoteChange={(val) => setCardioNotes(prev => ({ ...prev, [`${cs.type}_${cs.slot || ''}`]: val }))}
              onToggleComplete={async (val) => {
                await saveWorkoutLog(user.uid, { logDate: selectedDate, sessionType: cs.type, sessionSlot: cs.slot || null, completed: val, note: cardioNotes[`${cs.type}_${cs.slot || ''}`] || '' });
                onDataChange();
              }}
            />
          );
        });
      })()}

      {/* Check-in */}
      <FPCheckinCard checkin={dayCheckin} onSave={async (data) => { await saveCheckin(user.uid, { checkinDate: selectedDate, ...data }); onDataChange(); }} />

      {/* Benchmark (on benchmark weeks) */}
      {isBenchmarkWeek && (
        <FPBenchmarkCard existing={testResults.find(t => t.testDate === selectedDate)} blockNumber={profile.blockNumber}
          onSave={async (data) => { await saveTestResult(user.uid, data); onDataChange(); }} />
      )}

      {/* HR Zones quick ref */}
      <div className="dashboard-card" style={{ padding: 12, marginBottom: 16 }}>
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', alignItems: 'center' }}>
          <span style={{ color: '#94A3B8', fontSize: 11, fontWeight: 600 }}>HR ZONES</span>
          <span style={{ background: '#14B8A620', color: '#14B8A6', padding: '2px 8px', borderRadius: 6, fontSize: 11 }}>Easy {zones.easy.low}-{zones.easy.high}</span>
          <span style={{ background: '#3B82F620', color: '#3B82F6', padding: '2px 8px', borderRadius: 6, fontSize: 11 }}>Mod {zones.moderate.low}-{zones.moderate.high}</span>
          <span style={{ background: '#EF444420', color: '#EF4444', padding: '2px 8px', borderRadius: 6, fontSize: 11 }}>Hard {zones.hard.low}+</span>
        </div>
      </div>
    </div>
  );
}

// ─── Calendar View (Revamped) ───────────────────────────────
function FPCalendarView({ profile, workoutLogs, onSelectDate }) {
  const isMobile = useIsMobile();
  const startDate = new Date(profile.blockStartDate + 'T00:00:00');
  const todayStr = (() => { const t = new Date(); return t.toISOString().slice(0, 10); })();

  // Build a map of what was actually logged per date
  const logsByDate = useMemo(() => {
    const m = {};
    workoutLogs.filter(l => l.completed).forEach(l => {
      if (!m[l.logDate]) m[l.logDate] = [];
      m[l.logDate].push(l.sessionType);
    });
    return m;
  }, [workoutLogs]);

  // Generate 56 days
  const days = useMemo(() => {
    const result = [];
    for (let i = 0; i < 56; i++) {
      const d = new Date(startDate);
      d.setDate(d.getDate() + i);
      const dateStr = d.toISOString().slice(0, 10);
      const week = Math.floor(i / 7) + 1;
      const logged = logsByDate[dateStr] || [];
      const isPast = dateStr < todayStr;
      const isToday = dateStr === todayStr;
      const isFuture = dateStr > todayStr;
      result.push({ dayIndex: i, date: d, dateStr, week, logged, isPast, isToday, isFuture });
    }
    return result;
  }, [startDate, logsByDate, todayStr]);

  // Session tag component
  const Tag = ({ type, done }) => (
    <span style={{
      display: 'inline-block', padding: '1px 6px', borderRadius: 4, fontSize: 9, fontWeight: 700,
      background: done ? `${FP_COLORS[type]}` : 'transparent',
      color: done ? '#fff' : FP_COLORS[type],
      border: done ? 'none' : `1px solid ${FP_COLORS[type]}60`,
      lineHeight: '16px', textTransform: 'uppercase', letterSpacing: 0.5,
    }}>
      {FP_LABELS[type] || type}
    </span>
  );

  // Compute date range for header
  const endDate = new Date(startDate);
  endDate.setDate(endDate.getDate() + 55);
  const MONTH_NAMES_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const MONTH_NAMES_FULL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const startMonthYear = `${MONTH_NAMES_FULL[startDate.getMonth()]} ${startDate.getDate()}`;
  const endMonthYear = `${MONTH_NAMES_FULL[endDate.getMonth()]} ${endDate.getDate()}, ${endDate.getFullYear()}`;
  const dateRangeLabel = startDate.getFullYear() === endDate.getFullYear() ? `${startMonthYear} – ${endMonthYear}` : `${startMonthYear}, ${startDate.getFullYear()} – ${endMonthYear}`;

  return (
    <div style={{ maxWidth: 900, margin: '0 auto' }}>
      <h2 style={{ fontSize: 20, fontWeight: 700, color: '#E2E8F0', marginBottom: 4 }}>Block {profile.blockNumber} Calendar</h2>
      <p style={{ color: '#3B82F6', fontSize: 15, fontWeight: 600, marginBottom: 4 }}>{dateRangeLabel}</p>
      <p style={{ color: '#94A3B8', fontSize: 13, marginBottom: 16 }}>Tap any day to log or review. Filled = completed.</p>

      {/* Legend */}
      <div style={{ display: 'flex', gap: 10, marginBottom: 16, flexWrap: 'wrap' }}>
        {['push', 'pull', 'legs', 'walk', 'interval', 'rest'].map(t => (
          <div key={t} style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
            <div style={{ width: 10, height: 10, borderRadius: 3, background: FP_COLORS[t] }} />
            <span style={{ color: '#94A3B8', fontSize: 11, textTransform: 'capitalize' }}>{FP_LABELS[t]}</span>
          </div>
        ))}
      </div>

      {[1, 2, 3, 4, 5, 6, 7, 8].map(week => {
        const weekDays = days.filter(d => d.week === week);
        const ramp = getCardioRampForBlock(profile.blockNumber);
        const wd = ramp[week - 1];
        // Detect month boundary in this week
        const firstDay = weekDays[0]?.date;
        const lastDay = weekDays[weekDays.length - 1]?.date;
        const weekDateRange = firstDay && lastDay
          ? firstDay.getMonth() === lastDay.getMonth()
            ? `${MONTH_NAMES_SHORT[firstDay.getMonth()]} ${firstDay.getDate()}–${lastDay.getDate()}`
            : `${MONTH_NAMES_SHORT[firstDay.getMonth()]} ${firstDay.getDate()} – ${MONTH_NAMES_SHORT[lastDay.getMonth()]} ${lastDay.getDate()}`
          : '';

        return (
          <div key={week} style={{ marginBottom: 16 }}>
            <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, marginBottom: 6, flexWrap: 'wrap' }}>
              <span style={{ color: '#E2E8F0', fontSize: 13, fontWeight: 700 }}>Week {week}</span>
              <span style={{ color: '#3B82F6', fontSize: 12, fontWeight: 600 }}>{weekDateRange}</span>
              <span style={{ color: '#94A3B8', fontSize: 11 }}>
                {wd.walks.target} walks · {wd.intervals.length} interval{wd.intervals.length > 1 ? 's' : ''}
                {wd.benchmark ? ' · Benchmark' : ''}
              </span>
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: isMobile ? 4 : 6 }}>
              {weekDays.map(day => {
                const dayAbbr = ['S', 'M', 'T', 'W', 'T', 'F', 'S'][day.date.getDay()];
                const dayNum = day.date.getDate();
                const hasLogs = day.logged.length > 0;
                const missed = day.isPast && !hasLogs;
                // Show month abbreviation on the 1st of each month, or the first day of the block
                const showMonth = dayNum === 1 || day.dayIndex === 0;
                const monthAbbr = MONTH_NAMES_SHORT[day.date.getMonth()];

                return (
                  <button key={day.dayIndex} onClick={() => onSelectDate(day.dateStr)}
                    style={{
                      background: day.isToday ? 'rgba(59,130,246,0.12)' : missed ? 'rgba(239,68,68,0.05)' : '#1A1F35',
                      border: day.isToday ? '2px solid #3B82F6' : '1px solid #252B45',
                      borderRadius: 10, padding: isMobile ? '6px 3px' : '8px 6px', cursor: 'pointer', textAlign: 'center',
                      minHeight: isMobile ? 72 : 88, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 2,
                    }}
                    aria-label={`${dayAbbr} ${monthAbbr} ${dayNum}`}>
                    <div style={{ color: '#94A3B8', fontSize: 10 }}>{dayAbbr}</div>
                    {showMonth && <div style={{ color: '#3B82F6', fontSize: 9, fontWeight: 700, lineHeight: 1 }}>{monthAbbr}</div>}
                    <div style={{ color: day.isToday ? '#3B82F6' : '#E2E8F0', fontSize: isMobile ? 14 : 16, fontWeight: 700 }}>{dayNum}</div>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 2, alignItems: 'center' }}>
                      {day.logged.map((type, i) => <Tag key={i} type={type} done={true} />)}
                      {day.isFuture && day.logged.length === 0 && (
                        <span style={{ color: '#374151', fontSize: 9 }}>—</span>
                      )}
                      {missed && <span style={{ color: '#EF444480', fontSize: 9 }}>missed</span>}
                    </div>
                  </button>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ─── Progress View ──────────────────────────────────────────
function FPProgressView({ profile, workoutLogs, strengthSets, checkins, testResults }) {
  const isMobile = useIsMobile();
  const [selectedExercise, setSelectedExercise] = useState('');

  const exerciseNames = useMemo(() => {
    const names = new Set();
    strengthSets.forEach(s => names.add(s.exerciseName));
    return [...names].sort();
  }, [strengthSets]);

  const rhrData = useMemo(() => checkins.filter(c => c.restingHR).map(c => ({ date: c.checkinDate, rhr: c.restingHR })).sort((a, b) => a.date.localeCompare(b.date)), [checkins]);
  const feelData = useMemo(() => checkins.filter(c => c.feelRating).map(c => ({ date: c.checkinDate, feel: c.feelRating })).sort((a, b) => a.date.localeCompare(b.date)), [checkins]);
  const benchData = useMemo(() => testResults.map(t => ({ date: t.testDate, distance: t.distance, unit: t.distanceUnit, rhr: t.restingHR, block: t.blockNumber })).sort((a, b) => a.date.localeCompare(b.date)), [testResults]);

  const weightData = useMemo(() => {
    if (!selectedExercise) return [];
    const byDate = {};
    strengthSets.filter(s => s.exerciseName === selectedExercise).forEach(s => {
      if (!byDate[s.logDate] || s.weight > byDate[s.logDate].weight) byDate[s.logDate] = { date: s.logDate, weight: s.weight, reps: s.reps };
    });
    return Object.values(byDate).sort((a, b) => a.date.localeCompare(b.date));
  }, [strengthSets, selectedExercise]);

  // Weekly adherence
  const adherenceData = useMemo(() => {
    const startDate = new Date(profile.blockStartDate + 'T00:00:00');
    return [1, 2, 3, 4, 5, 6, 7, 8].map(week => {
      const weekStart = new Date(startDate);
      weekStart.setDate(weekStart.getDate() + (week - 1) * 7);
      const weekEnd = new Date(weekStart);
      weekEnd.setDate(weekEnd.getDate() + 6);
      const ws = weekStart.toISOString().slice(0, 10);
      const we = weekEnd.toISOString().slice(0, 10);
      const weekLogs = workoutLogs.filter(l => l.completed && l.logDate >= ws && l.logDate <= we);
      // Rough target: 3 lifts + walks + intervals per week
      const ramp = getCardioRampForBlock(profile.blockNumber);
      const wd = ramp[week - 1];
      const target = 3 + wd.walks.target + wd.intervals.length;
      const done = weekLogs.length;
      return { week: `Wk ${week}`, pct: target > 0 ? Math.min(100, Math.round((done / target) * 100)) : 0, done, target };
    });
  }, [workoutLogs, profile]);

  const fmt = (d) => { const p = d.split('-'); return `${parseInt(p[1])}/${parseInt(p[2])}`; };

  return (
    <div style={{ maxWidth: 800, margin: '0 auto' }}>
      <h2 style={{ fontSize: 20, fontWeight: 700, color: '#E2E8F0', marginBottom: 20 }}>Progress</h2>

      {/* RHR */}
      <div className="dashboard-card" style={{ padding: isMobile ? 16 : 20, marginBottom: 20 }}>
        <h3 style={{ color: '#8B5CF6', fontSize: 14, fontWeight: 600, marginBottom: 12 }}>Resting Heart Rate</h3>
        {rhrData.length > 1 ? (
          <ResponsiveContainer width="100%" height={200}>
            <LineChart data={rhrData}><CartesianGrid strokeDasharray="3 3" stroke="#252B45" />
              <XAxis dataKey="date" tick={{ fill: '#94A3B8', fontSize: 11 }} tickFormatter={fmt} />
              <YAxis tick={{ fill: '#94A3B8', fontSize: 11 }} domain={['auto', 'auto']} />
              <Tooltip contentStyle={{ background: '#1A1F35', border: '1px solid #374151', borderRadius: 8 }} />
              <Line type="monotone" dataKey="rhr" stroke="#8B5CF6" strokeWidth={2} dot={{ fill: '#8B5CF6', r: 3 }} name="RHR (bpm)" />
            </LineChart>
          </ResponsiveContainer>
        ) : <p style={{ color: '#94A3B8', fontSize: 13 }}>Log 2+ check-ins to see your trend.</p>}
      </div>

      {/* Feel */}
      <div className="dashboard-card" style={{ padding: isMobile ? 16 : 20, marginBottom: 20 }}>
        <h3 style={{ color: '#14B8A6', fontSize: 14, fontWeight: 600, marginBottom: 12 }}>How You Feel</h3>
        {feelData.length > 1 ? (
          <ResponsiveContainer width="100%" height={160}>
            <AreaChart data={feelData}><CartesianGrid strokeDasharray="3 3" stroke="#252B45" />
              <XAxis dataKey="date" tick={{ fill: '#94A3B8', fontSize: 11 }} tickFormatter={fmt} />
              <YAxis tick={{ fill: '#94A3B8', fontSize: 11 }} domain={[1, 5]} ticks={[1, 2, 3, 4, 5]} />
              <Tooltip contentStyle={{ background: '#1A1F35', border: '1px solid #374151', borderRadius: 8 }} />
              <Area type="monotone" dataKey="feel" stroke="#14B8A6" fill="rgba(20,184,166,0.2)" strokeWidth={2} name="Feel (1-5)" />
            </AreaChart>
          </ResponsiveContainer>
        ) : <p style={{ color: '#94A3B8', fontSize: 13 }}>Log 2+ check-ins to see your trend.</p>}
      </div>

      {/* Benchmarks */}
      <div className="dashboard-card" style={{ padding: isMobile ? 16 : 20, marginBottom: 20 }}>
        <h3 style={{ color: FP_COLORS.benchmark, fontSize: 14, fontWeight: 600, marginBottom: 12 }}>Benchmark Tests</h3>
        {benchData.length > 0 ? (
          <ResponsiveContainer width="100%" height={200}>
            <BarChart data={benchData}><CartesianGrid strokeDasharray="3 3" stroke="#252B45" />
              <XAxis dataKey="date" tick={{ fill: '#94A3B8', fontSize: 11 }} tickFormatter={fmt} />
              <YAxis tick={{ fill: '#94A3B8', fontSize: 11 }} />
              <Tooltip contentStyle={{ background: '#1A1F35', border: '1px solid #374151', borderRadius: 8 }} />
              <Bar dataKey="distance" fill={FP_COLORS.benchmark} name="Distance" radius={[4, 4, 0, 0]} />
            </BarChart>
          </ResponsiveContainer>
        ) : <p style={{ color: '#94A3B8', fontSize: 13 }}>Complete a benchmark test to see results.</p>}
      </div>

      {/* Weight progression */}
      <div className="dashboard-card" style={{ padding: isMobile ? 16 : 20, marginBottom: 20 }}>
        <h3 style={{ color: '#3B82F6', fontSize: 14, fontWeight: 600, marginBottom: 12 }}>Weight Progression</h3>
        <select className="select" style={{ marginBottom: 12, maxWidth: 280 }} value={selectedExercise} onChange={e => setSelectedExercise(e.target.value)}>
          <option value="">Select an exercise...</option>
          {exerciseNames.map(n => <option key={n} value={n}>{n}</option>)}
        </select>
        {weightData.length > 1 ? (
          <ResponsiveContainer width="100%" height={200}>
            <LineChart data={weightData}><CartesianGrid strokeDasharray="3 3" stroke="#252B45" />
              <XAxis dataKey="date" tick={{ fill: '#94A3B8', fontSize: 11 }} tickFormatter={fmt} />
              <YAxis tick={{ fill: '#94A3B8', fontSize: 11 }} />
              <Tooltip contentStyle={{ background: '#1A1F35', border: '1px solid #374151', borderRadius: 8 }} />
              <Line type="monotone" dataKey="weight" stroke="#3B82F6" strokeWidth={2} dot={{ fill: '#3B82F6', r: 3 }} name="Weight (lbs)" />
            </LineChart>
          </ResponsiveContainer>
        ) : <p style={{ color: '#94A3B8', fontSize: 13 }}>{selectedExercise ? 'Log 2+ sessions to chart.' : 'Pick an exercise above.'}</p>}
      </div>

      {/* Adherence */}
      <div className="dashboard-card" style={{ padding: isMobile ? 16 : 20, marginBottom: 20 }}>
        <h3 style={{ color: '#00B894', fontSize: 14, fontWeight: 600, marginBottom: 12 }}>Weekly Adherence</h3>
        <ResponsiveContainer width="100%" height={160}>
          <BarChart data={adherenceData}><CartesianGrid strokeDasharray="3 3" stroke="#252B45" />
            <XAxis dataKey="week" tick={{ fill: '#94A3B8', fontSize: 11 }} />
            <YAxis tick={{ fill: '#94A3B8', fontSize: 11 }} domain={[0, 100]} />
            <Tooltip contentStyle={{ background: '#1A1F35', border: '1px solid #374151', borderRadius: 8 }} formatter={(v) => `${v}%`} />
            <Bar dataKey="pct" fill="#00B894" name="Adherence" radius={[4, 4, 0, 0]} />
          </BarChart>
        </ResponsiveContainer>
      </div>
    </div>
  );
}

// ─── Fitness Plan Module (Root) ─────────────────────────────
function FitnessPlanModule({ user }) {
  const isMobile = useIsMobile();
  const [profile, setProfile] = useState(null);
  const [loading, setLoading] = useState(true);
  const [view, setView] = useState('today');
  const [selectedDate, setSelectedDate] = useState(() => new Date().toISOString().slice(0, 10));
  const [workoutLogs, setWorkoutLogs] = useState([]);
  const [strengthSets, setStrengthSetsState] = useState([]);
  const [checkins, setCheckinsState] = useState([]);
  const [testResults, setTestResultsState] = useState([]);

  const loadAllData = useCallback(async () => {
    if (!user) return;
    setLoading(true);
    const [p, wl, ss, ci, tr] = await Promise.all([
      loadEngineProfile(user.uid), loadWorkoutLogs(user.uid), loadStrengthSets(user.uid), loadCheckins(user.uid), loadTestResults(user.uid),
    ]);
    setProfile(p);
    setWorkoutLogs(wl);
    setStrengthSetsState(ss);
    setCheckinsState(ci);
    setTestResultsState(tr);
    setLoading(false);
  }, [user]);

  useEffect(() => { loadAllData(); }, [loadAllData]);

  if (!user) return <div style={{ textAlign: 'center', padding: 48 }}><p style={{ color: '#94A3B8', fontSize: 16 }}>Sign in to access Fitness Plan.</p></div>;
  if (loading) return <div style={{ textAlign: 'center', padding: 48 }}><p style={{ color: '#94A3B8', fontSize: 14 }}>Loading...</p></div>;

  if (!profile) {
    return <FitnessSetup onComplete={async (data) => {
      await saveEngineProfile(user.uid, { ...data, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
      loadAllData();
    }} />;
  }

  // Check if past block end
  const daysSinceStart = Math.round((new Date() - new Date(profile.blockStartDate + 'T00:00:00')) / 86400000);
  if (daysSinceStart >= 56) {
    return (
      <div style={{ maxWidth: 500, margin: '0 auto', padding: 24 }}>
        <div className="dashboard-card" style={{ padding: 32, textAlign: 'center' }}>
          <h2 style={{ fontSize: 22, fontWeight: 700, color: '#E2E8F0', marginBottom: 8 }}>Block {profile.blockNumber} Complete!</h2>
          <p style={{ color: '#94A3B8', fontSize: 14, marginBottom: 20 }}>Ready for the next 8-week block at a higher baseline?</p>
          <button onClick={async () => {
            const todayStr = new Date().toISOString().slice(0, 10);
            await saveEngineProfile(user.uid, { ...profile, blockNumber: profile.blockNumber + 1, blockStartDate: todayStr, updatedAt: new Date().toISOString() });
            loadAllData();
          }} className="btn btn-primary" style={{ padding: '12px 32px', fontSize: 16 }}>
            Start Block {profile.blockNumber + 1}
          </button>
        </div>
      </div>
    );
  }

  const views = [{ id: 'today', label: 'Today' }, { id: 'calendar', label: 'Calendar' }, { id: 'progress', label: 'Progress' }];

  return (
    <div>
      <div style={{ display: 'flex', gap: 4, marginBottom: 20, background: '#1A1F35', borderRadius: 10, padding: 4, maxWidth: 360 }}>
        {views.map(v => (
          <button key={v.id} onClick={() => setView(v.id)}
            style={{ flex: 1, padding: '8px 12px', borderRadius: 8, border: 'none', cursor: 'pointer',
              background: view === v.id ? '#3B82F6' : 'transparent', color: view === v.id ? 'white' : '#94A3B8',
              fontSize: 13, fontWeight: 600, transition: 'all 150ms' }}>
            {v.label}
          </button>
        ))}
      </div>

      {view === 'today' && <FPTodayView profile={profile} workoutLogs={workoutLogs} strengthSets={strengthSets}
        checkins={checkins} testResults={testResults} user={user} onDataChange={loadAllData}
        selectedDate={selectedDate} setSelectedDate={setSelectedDate} />}
      {view === 'calendar' && <FPCalendarView profile={profile} workoutLogs={workoutLogs}
        onSelectDate={(d) => { setSelectedDate(d); setView('today'); }} />}
      {view === 'progress' && <FPProgressView profile={profile} workoutLogs={workoutLogs} strengthSets={strengthSets}
        checkins={checkins} testResults={testResults} />}
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────
function App() {
  const isMobile = useIsMobile();
  const now = new Date();
  const [month, setMonth] = useState(now.getMonth());
  const [year, setYear] = useState(now.getFullYear());
  const [config, setConfigState] = useState(() => loadConfig());
  const [checks, setChecksState] = useState(() => loadChecks(now.getFullYear(), now.getMonth()));
  const [metrics, setMetricsState] = useState(() => loadMetrics(now.getFullYear(), now.getMonth()));
  const [notes, setNotesState] = useState(() => loadNotes(now.getFullYear(), now.getMonth()));
  const [journal, setJournalState] = useState(() => {
    const j = loadJournal(now.getFullYear(), now.getMonth());
    // Migrate old notes as first journal entry if journal is empty
    if (j.length === 0) {
      const oldNotes = loadNotes(now.getFullYear(), now.getMonth());
      if (oldNotes && oldNotes.trim()) {
        const migrated = [{ id: uuid(), text: oldNotes.trim(), date: new Date(now.getFullYear(), now.getMonth(), 1).toISOString() }];
        saveJournal(now.getFullYear(), now.getMonth(), migrated);
        return migrated;
      }
    }
    return j;
  });
  const [goals, setGoalsState] = useState(() => loadGoals(now.getFullYear(), now.getMonth()));
  const [collapsed, setCollapsed] = useState(new Set());
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [syncStatus, setSyncStatus] = useState('idle'); // idle | syncing | synced | error
  const [activeTab, setActiveTab] = useState('habits'); // habits | engine

  const { user, loading: authLoading, signIn, signOut } = useAuth();
  const prevUserRef = useRef(null);

  const daysInMonth = useMemo(() => getDaysInMonth(month, year), [month, year]);
  const allHabits = useMemo(() => flattenHabits(config), [config]);
  const booleanHabits = useMemo(() => allHabits.filter(h => h.type !== 'number'), [allHabits]);
  // Need year/month for goal calculations in stats
  // (year and month are already in scope from useState above)

  // ── Cloud sync on auth state change ──
  useEffect(() => {
    if (authLoading) return;
    const prevUser = prevUserRef.current;
    prevUserRef.current = user;

    if (!user) {
      // Signed out: wipe local data and reset in-memory state to defaults
      clearLocalUserData();
      localStorage.removeItem('dd-last-uid');
      const freshConfig = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
      setConfigState(freshConfig);
      setChecksState({});
      setMetricsState({});
      setNotesState('');
      setJournalState([]);
      setGoalsState(defaultGoals());
      setSyncStatus('idle');
      return;
    }

    // If switching accounts on the same browser, wipe the previous user's local cache first
    const lastUid = localStorage.getItem('dd-last-uid');
    if (lastUid && lastUid !== user.uid) {
      clearLocalUserData();
    }
    localStorage.setItem('dd-last-uid', user.uid);

    // User just signed in
    (async () => {
      setSyncStatus('syncing');
      try {
        // Check if cloud data exists
        const cloudConfig = await loadConfigCloud(user.uid);
        if (!cloudConfig) {
          // First login: migrate local data to cloud
          await migrateLocalToCloud(user.uid);
        } else {
          // Returning user: pull cloud data (migrate old boolean type if needed)
          const merged = migrateConfig({ categories: cloudConfig.categories });
          setConfigState(merged);
          saveConfig(merged);

          const cloudMonth = await loadMonthCloud(user.uid, year, month);
          if (cloudMonth) {
            if (cloudMonth.checks) { setChecksState(cloudMonth.checks); saveChecks(year, month, cloudMonth.checks); }
            if (cloudMonth.metrics) { setMetricsState(cloudMonth.metrics); saveMetrics(year, month, cloudMonth.metrics); }
            if (cloudMonth.notes !== undefined) { setNotesState(cloudMonth.notes); saveNotes(year, month, cloudMonth.notes); }
            if (cloudMonth.journal) { setJournalState(cloudMonth.journal); saveJournal(year, month, cloudMonth.journal); }
            if (cloudMonth.goals) { setGoalsState(cloudMonth.goals); saveGoals(year, month, cloudMonth.goals); }
          }
        }
        setSyncStatus('synced');
      } catch (err) {
        console.error('Cloud sync error:', err);
        setSyncStatus('error');
      }
    })();
  }, [user, authLoading]);

  // Persist config (local + cloud)
  const setConfig = useCallback((c) => {
    setConfigState(c);
    saveConfigCloud(c, user?.uid);
    if (user) setSyncStatus('synced');
  }, [user]);

  // Load data when month/year changes
  useEffect(() => {
    setChecksState(loadChecks(year, month));
    setMetricsState(loadMetrics(year, month));
    setNotesState(loadNotes(year, month));
    setGoalsState(loadGoals(year, month));
    const j = loadJournal(year, month);
    if (j.length === 0) {
      const oldNotes = loadNotes(year, month);
      if (oldNotes && oldNotes.trim()) {
        const migrated = [{ id: uuid(), text: oldNotes.trim(), date: new Date(year, month, 1).toISOString() }];
        saveJournal(year, month, migrated);
        setJournalState(migrated);
      } else {
        setJournalState([]);
      }
    } else {
      setJournalState(j);
    }

    // Also fetch from cloud in background
    if (user) {
      (async () => {
        setSyncStatus('syncing');
        try {
          const cloudMonth = await loadMonthCloud(user.uid, year, month);
          if (cloudMonth) {
            if (cloudMonth.checks) { setChecksState(cloudMonth.checks); saveChecks(year, month, cloudMonth.checks); }
            if (cloudMonth.metrics) { setMetricsState(cloudMonth.metrics); saveMetrics(year, month, cloudMonth.metrics); }
            if (cloudMonth.notes !== undefined) { setNotesState(cloudMonth.notes); saveNotes(year, month, cloudMonth.notes); }
            if (cloudMonth.journal) { setJournalState(cloudMonth.journal); saveJournal(year, month, cloudMonth.journal); }
            if (cloudMonth.goals) { setGoalsState(cloudMonth.goals); saveGoals(year, month, cloudMonth.goals); }
          }
          setSyncStatus('synced');
        } catch (err) {
          console.error('Cloud load error:', err);
          setSyncStatus('error');
        }
      })();
    }
  }, [month, year]);

  // Debounced cloud save helper
  const cloudSaveTimeout = useRef(null);
  const scheduleCloudSave = useCallback((checksVal, metricsVal, notesVal, journalVal, goalsVal) => {
    if (!user) return;
    clearTimeout(cloudSaveTimeout.current);
    cloudSaveTimeout.current = setTimeout(() => {
      saveMonthCloud(year, month, checksVal, metricsVal, notesVal, user.uid, journalVal, goalsVal);
      setSyncStatus('synced');
    }, 1000);
    setSyncStatus('syncing');
  }, [user, year, month]);

  // Persist checks (local immediately, cloud debounced)
  const setChecks = useCallback((updater) => {
    setChecksState(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      saveChecks(year, month, next);
      // Read current metrics/notes for cloud save
      scheduleCloudSave(next, loadMetrics(year, month), loadNotes(year, month));
      return next;
    });
  }, [year, month, scheduleCloudSave]);

  // Persist metrics (local immediately, cloud debounced)
  const setMetrics = useCallback((updater) => {
    setMetricsState(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      saveMetrics(year, month, next);
      scheduleCloudSave(loadChecks(year, month), next, loadNotes(year, month));
      return next;
    });
  }, [year, month, scheduleCloudSave]);

  // Persist notes (local immediately, cloud debounced)
  const setNotes = useCallback((val) => {
    setNotesState(val);
    saveNotes(year, month, val);
    scheduleCloudSave(loadChecks(year, month), loadMetrics(year, month), val);
  }, [year, month, scheduleCloudSave]);

  // Persist journal (local immediately, cloud debounced)
  const setJournal = useCallback((updater) => {
    setJournalState(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      saveJournal(year, month, next);
      scheduleCloudSave(loadChecks(year, month), loadMetrics(year, month), loadNotes(year, month), next, loadGoals(year, month));
      return next;
    });
  }, [year, month, scheduleCloudSave]);

  // Persist goals (local immediately, cloud debounced)
  const setGoals = useCallback((updater) => {
    setGoalsState(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      saveGoals(year, month, next);
      scheduleCloudSave(loadChecks(year, month), loadMetrics(year, month), loadNotes(year, month), loadJournal(year, month), next);
      return next;
    });
  }, [year, month, scheduleCloudSave]);

  const toggleCheck = useCallback((key) => {
    setChecks(prev => ({ ...prev, [key]: !prev[key] }));
  }, [setChecks]);

  const setMetric = useCallback((key, value) => {
    setMetrics(prev => {
      const next = { ...prev };
      if (value === undefined) { delete next[key]; } else { next[key] = value; }
      return next;
    });
  }, [setMetrics]);

  const toggleCollapse = useCallback((catId) => {
    setCollapsed(prev => {
      const next = new Set(prev);
      if (next.has(catId)) next.delete(catId); else next.add(catId);
      return next;
    });
  }, []);

  // ── Per-habit stats ──
  const habitStats = useMemo(() => {
    const stats = {};
    allHabits.forEach(h => {
      if (h.type === 'number') {
        let sum = 0; let entries = 0; let streak = 0; let maxStreak = 0;
        for (let d = 1; d <= daysInMonth; d++) {
          const val = metrics[cellKey(h.id, d)];
          if (val !== undefined && val !== '') {
            const num = typeof val === 'number' ? val : parseFloat(val);
            if (!isNaN(num)) { sum += num; entries++; streak++; if (streak > maxStreak) maxStreak = streak; }
            else { streak = 0; }
          } else { streak = 0; }
        }
        const goal = h.goal;
        const pct = goal ? Math.round((sum / goal) * 100) : (entries > 0 ? 100 : 0);
        stats[h.id] = { done: entries, pct: Math.min(pct, 100), remaining: goal ? Math.max(0, goal - sum) : 0, streak: maxStreak, sum, avg: entries > 0 ? sum / entries : 0, entries };
      } else {
        // Check-based habits: daily, specific_days, per_week, per_month
        let done = 0; let streak = 0; let maxStreak = 0;
        for (let d = 1; d <= daysInMonth; d++) {
          const checked = !!checks[cellKey(h.id, d)];
          if (h.type === 'specific_days') {
            // Only count checks on active days toward progress
            const isActive = isDayActiveForHabit(h, year, month, d);
            if (isActive && checked) { done++; streak++; if (streak > maxStreak) maxStreak = streak; }
            else if (isActive) { streak = 0; }
            // Non-active day checks don't break streak or count toward goal
          } else {
            if (checked) { done++; streak++; if (streak > maxStreak) maxStreak = streak; }
            else { streak = 0; }
          }
        }
        const goal = habitGoalForMonth(h, year, month);
        const pct = goal > 0 ? Math.round((done / goal) * 100) : 0;
        stats[h.id] = { done, pct: Math.min(pct, 100), remaining: Math.max(0, goal - done), streak: maxStreak, goal };
      }
    });
    return stats;
  }, [allHabits, checks, metrics, daysInMonth, year, month]);

  // ── Daily stats (check-based habits) ──
  const dailyData = useMemo(() => {
    const data = [];
    for (let d = 1; d <= daysInMonth; d++) {
      let count = 0, total = 0;
      booleanHabits.forEach(h => {
        if (h.type === 'specific_days' && !(h.activeDays || []).includes(getDayOfWeek(year, month, d))) return;
        total++;
        if (checks[cellKey(h.id, d)]) count++;
      });
      data.push({ day: d, pct: total > 0 ? Math.round((count / total) * 100) : 0, count });
    }
    return data;
  }, [booleanHabits, checks, daysInMonth, year, month]);

  // ── Global stats ──
  const { totalDone, totalPossible, overallPct, bestStreak, todayScore, todayTotal } = useMemo(() => {
    let totalDone = 0, totalPossible = 0;
    let bestStreak = { habit: '', count: 0 };

    booleanHabits.forEach(h => {
      const s = habitStats[h.id];
      if (s) {
        totalDone += s.done;
        totalPossible += (s.goal || habitGoalForMonth(h, year, month));
        if (s.streak > bestStreak.count) bestStreak = { habit: h.name, count: s.streak };
      }
    });

    const today = now.getDate();
    let todayScore = 0, todayTotal = 0;
    booleanHabits.forEach(h => {
      if (h.type === 'specific_days' && !(h.activeDays || []).includes(getDayOfWeek(year, month, today))) return;
      todayTotal++;
      if (checks[cellKey(h.id, today)]) todayScore++;
    });

    return {
      totalDone, totalPossible,
      overallPct: totalPossible > 0 ? Math.round((totalDone / totalPossible) * 100) : 0,
      bestStreak, todayScore, todayTotal,
    };
  }, [booleanHabits, habitStats, checks, daysInMonth, year, month]);

  // ── Weekly summaries ──
  const weeklyData = useMemo(() => {
    const weeks = [];
    let weekNum = 1;
    for (let start = 1; start <= daysInMonth; start += 7) {
      const end = Math.min(start + 6, daysInMonth);
      let done = 0, possible = 0;
      for (let d = start; d <= end; d++) {
        booleanHabits.forEach(h => {
          if (h.type === 'specific_days' && !(h.activeDays || []).includes(getDayOfWeek(year, month, d))) return;
          possible++;
          if (checks[cellKey(h.id, d)]) done++;
        });
      }
      weeks.push({ week: `Wk ${weekNum}`, pct: possible > 0 ? Math.round((done / possible) * 100) : 0, days: `${start}-${end}` });
      weekNum++;
    }
    return weeks;
  }, [booleanHabits, checks, daysInMonth, year, month]);

  return (
    <div style={{ maxWidth: 1400, margin: '0 auto', padding: isMobile ? '8px 6px' : '24px 16px' }}>
      <Header month={month} year={year} setMonth={setMonth} setYear={setYear} overallPct={overallPct} onOpenSettings={() => setSettingsOpen(true)} user={user} onSignIn={signIn} syncStatus={syncStatus} activeTab={activeTab} />

      {/* Tab bar */}
      <div style={{ display: 'flex', gap: 0, marginBottom: isMobile ? 12 : 20, background: '#1A1F35', borderRadius: 12, padding: 4, maxWidth: 280 }}>
        <button onClick={() => setActiveTab('habits')}
          style={{ flex: 1, padding: '10px 20px', borderRadius: 10, border: 'none', cursor: 'pointer', background: activeTab === 'habits' ? '#3B82F6' : 'transparent', color: activeTab === 'habits' ? 'white' : '#94A3B8', fontSize: 14, fontWeight: 700, letterSpacing: 1, transition: 'all 150ms' }}>
          HABITS
        </button>
        <button onClick={() => setActiveTab('engine')}
          style={{ flex: 1, padding: '10px 20px', borderRadius: 10, border: 'none', cursor: 'pointer', background: activeTab === 'engine' ? '#3B82F6' : 'transparent', color: activeTab === 'engine' ? 'white' : '#94A3B8', fontSize: 14, fontWeight: 700, letterSpacing: 1, transition: 'all 150ms' }}>
          FITNESS
        </button>
      </div>

      {activeTab === 'habits' && (
        <>
          <DashboardCards totalDone={totalDone} totalPossible={totalPossible} bestStreak={bestStreak} todayScore={todayScore} todayTotal={todayTotal} />
          <DailyChart dailyData={dailyData} />
          <HabitGrid config={config} checks={checks} metrics={metrics} toggleCheck={toggleCheck} setMetric={setMetric} collapsed={collapsed} toggleCollapse={toggleCollapse} daysInMonth={daysInMonth} habitStats={habitStats} month={month} year={year} />
          <GoalsPanel goals={goals} setGoals={setGoals} />
          <MetricsDashboard config={config} metrics={metrics} />
          <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : 'repeat(auto-fit, minmax(400px, 1fr))', gap: isMobile ? 12 : 24 }}>
            <WeeklySummary weeklyData={weeklyData} />
            <Journal journal={journal} setJournal={setJournal} />
          </div>
          <Leaderboard config={config} habitStats={habitStats} />
        </>
      )}

      {activeTab === 'engine' && (
        <FitnessPlanModule user={user} />
      )}

      <SettingsPanel isOpen={settingsOpen} onClose={() => setSettingsOpen(false)} config={config} setConfig={setConfig} user={user} onSignOut={signOut} />
      <div style={{ textAlign: 'center', padding: '24px 0', color: '#94A3B8', fontSize: 12 }}>
        Daily Disciplines v2 — Built for consistency, not perfection.
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
</html>
